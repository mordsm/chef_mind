[project]
name = "chef-mind"
version = "0.1.0"
description = "Standalone, reviewed-knowledge Chef Core service"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "numpy>=2,<3",
  "openai>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "playwright>=1.64.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["postgres: requires a dedicated CHEF_TEST_POSTGRES_URL database"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint.per-file-ignores]
# FastAPI explicitly uses dependency objects as parameter defaults.
"backend/app/main.py" = ["B008"]
"backend/app/coach.py" = ["B008"]
"backend/app/culinary_sources.py" = ["B008"]
"backend/app/problem_rules.py" = ["B008"]
"backend/app/method_policy.py" = ["B008"]
