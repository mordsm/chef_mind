# Culinary Knowledge Base - Production Graph
# Architecture: Core Ontological Domain Model for Sous-Chef Autonomous Engine

base_ingredients:
  # ============================================================================
  # POULTRY (עופות ובעלי כנף)
  # ============================================================================
  chicken_breast:
    name: "חזה עוף"
    category: "עופות"
    base_rules:
      - "ייבוש קפדני בנייר סופג לפני מגע עם חום ישיר."
      - "חיתוך בניצב לכיוון הסיבים בלבד."
    safety_temp: "74°C"
    prep_notes: "רגיש מאוד לייבוש עקב היעדר שומן תוך-שרירי; מומלץ להשוות עובי באמצעות שיטוח מכני עדין."

  chicken_thighs_boneless:
    name: "פרגית (ירך ללא עצם)"
    category: "עופות"
    base_rules:
      - "פריסה מלאה של הנתח למניעת כיסי שומן לא צרובים."
      - "עמידות גבוהה לחום יבש ממושך."
    safety_temp: "74°C"
    prep_notes: "חיתוך גידים עודפים; ייבוש שטח פנים."

  chicken_thighs_bone_in:
    name: "כרעיים / שוקיים עם עצם"
    category: "עופות"
    base_rules:
      - "צריבה על צד העור להמסת שומן תת-עורי מרבי."
      - "בישול ממושך סביב העצם להבטחת עשייה בטוחה."
    safety_temp: "74°C"
    prep_notes: "בדיקת ניקיון סחוסים ועצמות שבורות."

  chicken_wings:
    name: "כנפי עוף"
    category: "עופות"
    base_rules:
      - "הפרדה בין כנף עליונה לאמצעית."
      - "ייבוש מוחלט לשם קבלת מרקם עור פריך."
    safety_temp: "74°C"
    prep_notes: "הסרת קצוות הכנף (שמירה לציר)."

  chicken_giblets:
    name: "קורקבנים / כבדי עוף"
    category: "עופות"
    base_rules:
      - "קורקבנים: דורשים ריכוך ממושך."
      - "כבדים: צריבה מהירה בלבד למניעת מרקם מגורען."
    safety_temp: "74°C"
    prep_notes: "ניקוי קפדני של כיסי מרה ושאריות שומן."

  chicken_whole:
    name: "עוף שלם"
    category: "עופות"
    base_rules:
      - "קשירה אנטומית (Trussing) לפיזור חום אחיד."
      - "אוורור וקירור ללא כיסוי 12 שעות לייבוש העור."
    safety_temp: "74°C"
    prep_notes: "הסרת שאריות נוצות וניקוי חלל הבטן."

  turkey_breast:
    name: "חזה הודו"
    category: "עופות"
    base_rules:
      - "המלחה מוקדמת (Dry/Wet Brining) מחייבת."
      - "בישול בחום מבוקר למניעת הידוק-יתר של הסיבים."
    safety_temp: "74°C"
    prep_notes: "שמירה על לחות באמצעות עטיפה או שימון שומני."

  turkey_thigh:
    name: "שווארמה הודו (ירך הודו נקבה)"
    category: "עופות"
    base_rules:
      - "פירוק רקמות חיבור בטמפרטורה מתונה."
      - "התאמה מלאה למרינדות חומציות."
    safety_temp: "74°C"
    prep_notes: "הוצאת גידים פנימיים עבים."

  duck_breast:
    name: "חזה אווז (מגרט)"
    category: "עופות"
    base_rules:
      - "חריצת שתי-וערב בשכבת השומן ללא פציעת הבשר."
      - "התחלת בישול במחבת קרה להמסה הדרגתית של השומן."
    safety_temp: "57°C"
    prep_notes: "ייבוש קפדני; הסרת קרומי כסף מהצד הבשרי."

  duck_leg:
    name: "שוק אווז"
    category: "עופות"
    base_rules:
      - "בישול איטי בשומן עצמי (קונפי)."
      - "הפרדה מושלמת של הבשר מהעצם בסיום."
    safety_temp: "82°C"
    prep_notes: "המלחה והשריה מוקדמת של 24 שעות עם עשבי תיבול."

  # ============================================================================
  # BEEF & LAMB (בקר, עגל וטלה)
  # ============================================================================
  beef_ribeye:
    name: "אנטרקוט (Ribeye)"
    category: "בקר"
    base_rules:
      - "הבאה לטמפרטורת חדר (20 דקות) לפני צריבה."
      - "מנוחה שווה לחצי מזמן הצלייה לפני פריסה."
    safety_temp: "54°C"
    prep_notes: "שיוש גבוה; המלחה גסה 40 דקות מראש או ממש לפני המפגש עם האש."

  beef_tenderloin:
    name: "פילה בקר (Tenderloin)"
    category: "בקר"
    base_rules:
      - "דל שומן; צריבה אגרסיבית מהירה."
      - "השקיה רציפה בחמאה או שומן עמוק (Basting)."
    safety_temp: "52°C"
    prep_notes: "הסרת גיד הכסף (Silver skin) לחלוטין."

  beef_sirloin:
    name: "סינטה (Striploin)"
    category: "בקר"
    base_rules:
      - "חריצת פס השומן החיצוני למניעת התקשתות הנתח."
      - "חיתוך דק בניצב לכיוון הסיב."
    safety_temp: "54°C"
    prep_notes: "ייבוש מקסימלי; בישול בחום ישיר גבוה."

  beef_short_ribs:
    name: "אסאדו (שפונדרה / Short Ribs)"
    category: "בקר"
    base_rules:
      - "בישול רטוב/עקיף ממושך להמסת קולגן לג'לטין."
      - "מנוחה וצינון חלקי לפני חיתוך למניעת התפרקות."
    safety_temp: "92°C"
    prep_notes: "הסרת ממברנה מהצד הפנימי של העצם."

  beef_ground:
    name: "בקר טחון"
    category: "בקר"
    base_rules:
      - "יחס שומן/בשר מותאם (מינימום 20% שומן להמבורגר)."
      - "עיבוד מינימלי למניעת הפעלת מיוזין שגורם למרקם דחוס."
    safety_temp: "71°C"
    prep_notes: "שמירה בטמפרטורה קרה מאוד עד לרגע הצלייה."

  beef_shank:
    name: "אוסובוקו (שוק בקר)"
    category: "בקר"
    base_rules:
      - "קימוח עדין וצריבה עמוקה לפני בישול בנוזל."
      - "קשירה סביב ההיקף לשמירת שלמות המבנה והמח."
    safety_temp: "90°C"
    prep_notes: "חריצת הקרום החיצוני למניעת קיעור בעת הצריבה."

  beef_flank:
    name: "פלנק / באו Moral"
    category: "בקר"
    base_rules:
      - "צלייה מהירה לחום פנימי בינוני בלבד."
      - "פריסה באלכסון חד בניצב מוחלט לסיבים הארוכים."
    safety_temp: "54°C"
    prep_notes: "סופג מרינדות בצורה יוצאת דופן."

  beef_brisket:
    name: "חזה בקר (בריסקט)"
    category: "בקר"
    base_rules:
      - "עישון או בישול ארוך בלחות גבוהה."
      - "ניהול קפדני של שלב הקיפאון (The Stall) בבישול ארוך."
    safety_temp: "95°C"
    prep_notes: "יישור שומן לעובי אחיד של כ-6 מ\"מ."

  lamb_chops:
    name: "צלעות טלה"
    category: "טלה"
    base_rules:
      - "צריבה חמה בצד השומן להמסה וצבע עמוק."
      - "שמירה על דרגת עשייה מדיום-רר."
    safety_temp: "56°C"
    prep_notes: "חשיפת עצמות (Frenching) לפרזנטציה נקייה."

  lamb_shoulder:
    name: "כתף טלה"
    category: "טלה"
    base_rules:
      - "צלייה איטית ומכוסה בנוזלים ארומטיים."
      - "פירוק שומן עודף בסיום הבישול."
    safety_temp: "88°C"
    prep_notes: "חריצים עמוקים להחדרת שום ועשבי תיבול."

  # ============================================================================
  # FISH & SEAFOOD (דגים ומאכלי ים)
  # ============================================================================
  fish_salmon_fillet:
    name: "פילה סלמון"
    category: "דגים"
    base_rules:
      - "צריבה ממושכת (80% מהזמן) על צד העור לקבלת קריספיות."
      - "הימנעות מבישול יתר (פליטת אלבומין לבן מעידה על חום יתר)."
    safety_temp: "50°C"
    prep_notes: "שליפת עצמות רוחביות (Pin bones) באמצעות פינצטה ייעודית."

  fish_tuna_loin:
    name: "נתח טונה אדומה"
    category: "דגים"
    base_rules:
      - "צריבה קיצונית וקצרה של 30-45 שניות לכל צד בלבד."
      - "הליבה חייבת להישאר נאה וקרה/פושרת."
    safety_temp: "42°C"
    prep_notes: "ייבוש קפדני; שימוש בסכין חדה ללא הפעלת לחץ מועך."

  fish_sea_bass_whole:
    name: "לברק שלם"
    category: "דגים"
    base_rules:
      - "חריצים אלכסוניים בעור עד השדרה לחדירת חום אחידה."
      - "המלחה בתוך חלל הבטן ומילוי בעשבי תיבול."
    safety_temp: "58°C"
    prep_notes: "הסרת קשקשים וזימים מוחלטת."

  fish_sea_bream_fillet:
    name: "פילה דניס"
    category: "דגים"
    base_rules:
      - "לחיצה עדינה עם מרית שניות ראשונות במחבת למניעת התכווצות."
      - "בישול בחום גבוה וקצר."
    safety_temp: "55°C"
    prep_notes: "ייבוש עור מוחלט; בדיקת קשקשים שנותרו בשוליים."

  fish_cod_fillet:
    name: "פילה בקלה / קוד"
    category: "דגים"
    base_rules:
      - "המלחה מוקדמת למיצוק הבשר העדין (15 דקות)."
      - "תנועה מינימלית במחבת לשמירה על שלמות הדפים (Flakes)."
    safety_temp: "55°C"
    prep_notes: "בשר רך מאוד, נוטה להתפרק אם מטופל באגרסיביות."

  fish_sardines_fresh:
    name: "סרדינים טריים"
    category: "דגים"
    base_rules:
      - "צלייה ישירה וקצרה בחום אדיר."
      - "תיבול בחמיצות גבוהה (לימון/חומץ) לאיזון שמנוניות."
    safety_temp: "60°C"
    prep_notes: "ניקוי קשקשים ומעיים בעדינות באצבעות מתחת למים זורמים."

  seafood_shrimp:
    name: "שרימפס / קריסטל"
    category: "דגים ופירות ים"
    base_rules:
      - "בישול של 90-120 שניות עד קבלת צורת האות C (צורת O מעידה על בישול יתר)."
      - "ייבוש שטח פנים להשחמה."
    safety_temp: "60°C"
    prep_notes: "הסרת הראש והשריון, וחריצה בגב לשליפת צינור העיכול השחור."

  seafood_calamari:
    name: "דיונון / קלמארי"
    category: "דגים ופירות ים"
    base_rules:
      - "עיקרון 2 הדקות או 40 הדקות: צריבה מהירה או בישול ארוך מאוד."
      - "כל זמן ביניים יהפוך את הבשר לצמיגי."
    safety_temp: "60°C"
    prep_notes: "חיתוך לטבעות אחידות או חריצת שתי-וערב פנימית."

  seafood_scallops:
    name: "סקאלופס (מסרק ים)"
    category: "דגים ופירות ים"
    base_rules:
      - "משטח יבש לחלוטין לקבלת קרמליזציה מהירה."
      - "צריבה של 90 שניות מצד ראשון ו-30 שניות מצד שני."
    safety_temp: "46°C"
    prep_notes: "הסרת שריר התמיכה הצדדי הקשיח."

  # ============================================================================
  # VEGETABLES: ALLIUMS & BULBS (בצלים ופקעות)
  # ============================================================================
  veg_onion_yellow:
    name: "בצל צהוב"
    category: "ירקות - בצלים"
    base_rules:
      - "חיתוך אחיד בהתאם לסיבים לשליטה בקצב שחרור סוכרים."
      - "הזעה איטית בשומן לריכוך ללא השחמה ראשונית."
    prep_notes: "הסרת קליפה חיצונית; השארת השורש לייצוב בעת חיתוך לקוביות."

  veg_onion_red:
    name: "בצל סגול"
    category: "ירקות - בצלים"
    base_rules:
      - "חום מתון לשימור גוון סגול עמוק."
      - "איזון מתיקות בחמיצות עדינה."
    prep_notes: "מעולה ליישום נא או כבוש מהיר."

  veg_garlic_cloves:
    name: "שיני שום"
    category: "ירקות - בצלים"
    base_rules:
      - "שום שרוף מפתח מרירות בלתי הפיכה - שליטה מדויקת בחום."
      - "מידת הקיצוץ קובעת את עוצמת האליצין המשתחרר."
    prep_notes: "הסרת הנבט הירוק הפנימי אם קיים."

  veg_shallot:
    name: "שאלוט"
    category: "ירקות - בצלים"
    base_rules:
      - "קיצוץ דק במיוחד (Brunoised) לרטבים קלאסיים."
      - "קרמליזציה מהירה יותר מבצל רגיל עקב ריכוז סוכר גבוה."
    prep_notes: "הסרת קליפה דקה בעדינות."

  veg_leek:
    name: "כרישה (לוף)"
    category: "ירקות - בצלים"
    base_rules:
      - "שימוש בחלק הלבן והירוק-בהיר בעיקר."
      - "שטיפה יסודית לאחר חריצה עקב חול הנלכד בין השכבות."
    prep_notes: "חיתוך לאורכה ושטיפה תחת מים זורמים קרים."

  # ============================================================================
  # VEGETABLES: NIGHTSHADES (סולניים)
  # ============================================================================
  veg_eggplant:
    name: "חציל"
    category: "ירקות - סולניים"
    base_rules:
      - "המלחה מוקדמת והגרת נוזלים למניעת ספיגת שמן מופרזת."
      - "בישול מלא עד ריכוך מוחלט (חציל חצי מבושל אינו אכיל)."
    prep_notes: "בחירת חציל קל משקל, מתוח וללא חרצנים רבים."

  veg_tomato_round:
    name: "עגבנייה עגולה"
    category: "ירקות - סולניים"
    base_rules:
      - "חליטה וקילוף (Monder) אם מיועדת לרטבים עדינים."
      - "המלחה להדגשת חומציות ומתיקות טבעית."
    prep_notes: "הסרת העוקץ; חיתוך עם סכין משוננת."

  veg_tomato_cherry:
    name: "עגבניות שרי"
    category: "ירקות - סולניים"
    base_rules:
      - "צלייה בחום גבוה עד פיצוץ הקליפה וריכוז הסוכר."
      - "שימור שלמותן בבישול מהיר להשגת מרקם מתפרץ."
    prep_notes: "שטיפה והסרת גבעולים."

  veg_bell_pepper_red:
    name: "פלפל אדום (גמבה)"
    category: "ירקות - סולניים"
    base_rules:
      - "קריעה או חריכה בחום ישיר לקילוף קל של הקליפה החיצונית."
      - "הסרת מחיצות פנימיות לבנות למניעת טעם מר."
    prep_notes: "חיתוך לרצועות או קוביות אחידות."

  veg_chili_fresh:
    name: "פלפל חריף ירוק / אדום"
    category: "ירקות - סולניים"
    base_rules:
      - "עוצמת החריפות מרוכזת בציפה (המחיצה הלבנה) ובגרעינים."
      - "פיזור אחיד בשומן בתחילת הבישול לחילוץ קפסאיצין."
    prep_notes: "עבודה עם כפפות; שטיפת ידיים קפדנית."

  # ============================================================================
  # VEGETABLES: CRUCIFEROUS (מצליבים)
  # ============================================================================
  veg_broccoli:
    name: "ברוקולי"
    category: "ירקות - מצליבים"
    base_rules:
      - "חליטה מהירה במים מומלחים מאוד והעברה לאמבט קרח לשימור צבע ירוק."
      - "גבעולים מקולפים מתבשלים באותו קצב כמו התפרחת."
    prep_notes: "חיתוך לתפרחות שוות גודל; קילוף השכבה הסיבית של הגזע."

  veg_cauliflower:
    name: "כרובית"
    category: "ירקות - מצליבים"
    base_rules:
      - "צריבה חזקה לקבלת טעמים אגוזיים עמוקים."
      - "שמירה על פריכות (אל-דנטה) במניעת ריחות גופרית הנובעים מבישול יתר."
    prep_notes: "פירוק לתפרחות; אפשרות לפריסה לפרוסות רוחב ('סטייק כרובית')."

  veg_cabbage_white:
    name: "כרוב לבן"
    category: "ירקות - מצליבים"
    base_rules:
      - "פריסה דקה מאוד אם מוגש נא."
      - "השחמה איטית ועמוקה מפתחת מתיקות טבעית מדהימה."
    prep_notes: "הסרת הגלדים החיצוניים והליבה הקשה המרכזית."

  veg_cabbage_red:
    name: "כרוב אדום"
    category: "ירקות - מצליבים"
    base_rules:
      - "הוספת חומצה (חומץ/תפוח) במהלך הבישול לשימור צבע אדום בוהק."
      - "מרקם סיבי יותר מכרוב לבן - דורש זמן בישול מוגבר."
    prep_notes: "פריסה דקה; המלחה וסחיטה אם מיועד לסלט."

  veg_brussels_sprouts:
    name: "כרוביות ניצנים"
    category: "ירקות - מצליבים"
    base_rules:
      - "חצייה וצלייה ישירה על החלק השטוח בחום גבוה."
      - "הימנעות מהרתחה ממושכת למניעת שחרור תרכובות גופרית."
    prep_notes: "קטימת הבסיס הקשיח והסרת עלים מצהיבים."

  # ============================================================================
  # VEGETABLES: ROOTS & TUBERS (שורשים ופקעות)
  # ============================================================================
  veg_potato_russet:
    name: "תפוח אדמה עתיר עמילן (אדום/ראסל)"
    category: "ירקות - שורשים"
    base_rules:
      - "התחלת בישול במים קרים ומומלחים בלבד להבטחת בישול אחיד."
      - "ייבוש מהאדים לפני מעיכה או צלייה לפריכות מרבית."
    prep_notes: "קילוף והחזקה במים קרים למניעת השחרה אנזימטית."

  veg_sweet_potato:
    name: "בטטה"
    category: "ירקות - שורשים"
    base_rules:
      - "שבירת עמילנים למלטוז מתרחשת בטווח שבין 60°C ל-75°C."
      - "איזון מתיקות במלח גס, חריפות או חמיצות."
    prep_notes: "קילוף מהיר; חיתוך גס."

  veg_carrot:
    name: "גזר"
    category: "ירקות - שורשים"
    base_rules:
      - "זיגוג בשומן ומעט סוכר/נוזל מדגיש את הטעם האדמתי."
      - "חיתוך אחיד (ז'וליין או וישי) חיוני לקצב בישול שווה."
    prep_notes: "קילוף דק; קטימת קצוות."

  veg_beetroot:
    name: "סלק"
    category: "ירקות - שורשים"
    base_rules:
      - "צלייה בקליפה בנייר כסף שומרת על עסיסיות וטעמים מרוכזים."
      - "קילוף קל תחת מים זורמים לאחר הצלייה."
    prep_notes: "עבודה עם כפפות למניעת הכתמה."

  veg_celeriac:
    name: "שורש סלרי"
    category: "ירקות - שורשים"
    base_rules:
      - "סופג חמאה ושמנת מצוין במחית."
      - "רגיש לחמצון - יש לטבול במי לימון לאחר קילוף."
    prep_notes: "הסרת הקליפה החיצונית העבה והמחוספסת בעזרת סכין שף."

  veg_parsnip:
    name: "גזר לבן (פסטרנק)"
    category: "ירקות - שורשים"
    base_rules:
      - "טעם מתוק ואניסי; נחרך מהר מגזר רגיל עקב ריכוז סוכר."
      - "הסרת הליבה המעוצה אם השורש גדול ומבוגר."
    prep_notes: "קילוף וקיצוץ אחיד."

  veg_fennel:
    name: "שומר"
    category: "ירקות - שורשים וגבעולים"
    base_rules:
      - "נא: חיתוך דק כנייר במנדולינה; מבושל: ריכוך איטי מקורמל."
      - "השארת השורש מחזיקה את הפלחים בשלמותם בבישול."
    prep_notes: "קטימת הגבעולים הקשים; שמירת העלעלים הירוקים לקישוט."

  # ============================================================================
  # VEGETABLES: SQUASHES & GREENS (דלועיים וירוקים)
  # ============================================================================
  veg_zucchini:
    name: "זוקיני / קישוא"
    category: "ירקות - דלועיים"
    base_rules:
      - "אחוז מים גבוה מאוד; צריבה בחום אדיר ומהיר למניעת רפיסות."
      - "המלחה ממש ברגע המגע עם האש."
    prep_notes: "חיתוך לפרוסות עבות או רבעים אורכיים."

  veg_butternut_squash:
    name: "דלורית"
    category: "ירקות - דלועיים"
    base_rules:
      - "מרקם יבש יחסית לדלעת; אידיאלית לצלייה ומרקים חלקים."
      - "קרמליזציה מהירה של הסוכרים בתנור."
    prep_notes: "קילוף בעזרת קולפן חזק; הוצאת הגרעינים בכף."

  veg_spinach:
    name: "תרד ניו-זילנדי / טורקי"
    category: "ירקות - ירוקים"
    base_rules:
      - "איבוד נפח קיצוני (מעל 85%) בבישול קצר."
      - "הקפצה מהירה של שניות ספורות וסחיטת נוזלים עודפים."
    prep_notes: "שטיפה במספר אמבטיות מים לניקוי יסודי של חול."

  veg_kale:
    name: "קייל"
    category: "ירקות - ירוקים"
    base_rules:
      - "אם מוגש נא: עיסוי ידני במלח ושמן שובר את הסיבים הקשים."
      - "עמיד לחום גבוה - אינו מתפרק בבישול ארוך."
    prep_notes: "הפשטת העלים מהשדרה הסיבית הקשה."

  veg_asparagus_green:
    name: "אספרגוס ירוק"
    category: "ירקות - גבעולים"
    base_rules:
      - "שבירה טבעית של החלק התחתון הסיבי בידיים."
      - "בישול מינימלי; חייב לשמור על מרקם פריך לחלוטין (Snappy)."
    prep_notes: "קילוף השליש התחתון אם הגבעול עבה במיוחד."

  veg_green_beans:
    name: "שעועית ירוקה עדינה"
    category: "ירקות - ירוקים"
    base_rules:
      - "חליטה מהירה במים מלוחים והקפצה קצרה בשומן חם."
      - "עצירת בישול מהירה לשמירה על צבע ירוק בוהק."
    prep_notes: "קטימת הקצוות (הסרת ה\"זנב\")."

  veg_mushrooms_cremini:
    name: "פטריות שמפיניון / פורטובלו"
    category: "פטריות"
    base_rules:
      - "צריבה במחבת חמה ויבשה לחילוץ מים, ורק אז הוספת שומן ומלח."
      - "לא להעמיס את המחבת - עומס גורם לאידוי במקום השחמה."
    prep_notes: "ניקוי במברשת או נייר לח בלבד; אין להשרות במים."

  # ============================================================================
  # LEGUMES & GRAINS (קטניות ודגנים)
  # ============================================================================
  legume_chickpeas:
    name: "גרגירי חומוס"
    category: "קטניות"
    base_rules:
      - "השריה ממושכת של 12-24 שעות במים קרים."
      - "הוספת מלח רק בחצי השני של הבישול למניעת קליפה קשה."
    prep_notes: "הסרת קצף וקליפות צפות במהלך הרתיחה."

  legume_lentils_brown:
    name: "עדשים חומות / ירוקות"
    category: "קטניות"
    base_rules:
      - "אינן דורשות השריה מוקדמת."
      - "בישול ברתיחה עדינה בלבד למניעת פיצוץ הקליפה."
    prep_notes: "ברירה קפדנית מאבנים ושטיפה במסננת."

  legume_lentils_red:
    name: "עדשים כתומות"
    category: "קטניות"
    base_rules:
      - "מתפרקות במהירות; מעולות להסמכת מרקים ונזידים."
      - "בישול קצר של 15-20 דקות ללא מכסה הדוק."
    prep_notes: "שטיפה מהירה במים קרים."

  legume_white_beans:
    name: "שעועית לבנה"
    category: "קטניות"
    base_rules:
      - "השריה של 12 שעות; בישול איטי מאוד לשמירה על שלמות הגרגיר."
      - "בדיקת רכות על ידי מעיכת גרגיר בין האצבעות ללא התנגדות פנימית."
    prep_notes: "סינון מי ההשריה ובישול במים מתוקים נקיים."

  grain_rice_basmati:
    name: "אורז בסמטי"
    category: "דגנים"
    base_rules:
      - "שטיפה עד יציאת מים צלולים לחלוטין (הסרת עמילן חופשי)."
      - "מנוחה של 10 דקות בסיר סגור בתום הבישול לפני אוורור במזלג."
    prep_notes: "השריה של 30 דקות מקצרת בישול ומאריכה את הגרגר."

  grain_rice_arborio:
    name: "אורז ריזוטו (ארבוריו / קרנרולי)"
    category: "דגנים"
    base_rules:
      - "אין לשטוף! העמילן החיצוני חיוני ליצירת המרקם הקרמי."
      - "קליה יבשה בשומן (Tostatura) עד שקיפות לפני הוספת נוזל חם."
    prep_notes: "שימוש בציר רותח בלבד בהוספה הדרגתית."

  grain_quinoa:
    name: "קינואה"
    category: "דגנים ופסאודו-דגנים"
    base_rules:
      - "שטיפה יסודית במסננת צפופה לסילוק שכבת הספונין המרירה."
      - "יחס נוזל לאורז מדויק: 1 חלק קינואה ל-1.75 חלקי מים."
    prep_notes: "קליה יבשה בסיר קצרות לפני הוספת מים לטעם אגוזי."

  grain_pasta_durum:
    name: "פסטה יבשה (חיטת דורום)"
    category: "פסטה ודגנים"
    base_rules:
      - "בישול בהרבה מים מומלחים כמי ים (10 גרם מלח לליטר מים)."
      - "סיום בישול (Mantecatura) בתוך הרוטב עם מי בישול עשירי עמילן."
    prep_notes: "שמירה על דרגת עשייה אל-דנטה קפדנית."

  # ============================================================================
  # DAIRY & CHEESES (מוצרי חלב וגבינות)
  # ============================================================================
  dairy_butter:
    name: "חמאה צהובה"
    category: "מוצרי חלב"
    base_rules:
      - "נקודת עישון נמוכה (150°C); בקרת חום למניעת שריפת מוצקי חלב."
      - "שילוב לקראת סוף הבישול (Mounting) ליצירת תחליב והברקה."
    prep_notes: "חיתוך לקוביות קרות אם מיועד להסמכת רוטב."

  dairy_heavy_cream:
    name: "שמנת מתוקה (38%)"
    category: "מוצרי חלב"
    base_rules:
      - "אחוז שומן גבוה מונע התפרקות (Curdling) במפגש עם חומציות וחום."
      - "צמצום בחום עדין בלבד."
    prep_notes: "שמירה בקירור עד רגע השימוש."

  dairy_parmigiano:
    name: "פרמז'ן (Parmigiano Reggiano)"
    category: "גבינות"
    base_rules:
      - "גירוד דק במעמד הבישול; הוספה מחוץ לחום ישיר למניעת גושים אלסטיים."
      - "עשירה בגלוטמט טבעי (אומאמי)."
    prep_notes: "שמירת הקליפה הקשה להעשרת מרקים וצירים."

  dairy_mozzarella_fresh:
    name: "מוצרלה טרייה"
    category: "גבינות"
    base_rules:
      - "הגרת נוזלים במסננת שעה לפני אפייה על בצק למניעת שלוליות."
      - "נמסה מהר מאוד - חשיפה קצרה לחום קיצוני."
    prep_notes: "קריעה ידנית עדיפה על חיתוך בסכין."

  dairy_halloumi:
    name: "גבינת חלומי"
    category: "גבינות"
    base_rules:
      - "נקודת התכה גבוהה; מיועדת לצריבה ישירה במחבת יבשה או בגריל."
      - "הגשה מיידית בעודה חמה ורכה."
    prep_notes: "ייבוש קפדני בנוזל לפני צריבה."

  # ============================================================================
  # PANTRY: HERBS & AROMATICS (עשבי תיבול ותבלינים)
  # ============================================================================
  herb_rosemary:
    name: "רוזמרין טרי"
    category: "עשבי תיבול"
    base_rules:
      - "עשב שרפי חזק; הוספה בתחילת הבישול למיצוי שמנים אתריים."
      - "שימוש מבוקר למניעת השתלטות טעם."
    prep_notes: "הפשטת העלים מן הגבעול המעוצה וקיצוץ דק."

  herb_thyme:
    name: "טימין (קורנית)"
    category: "עשבי תיבול"
    base_rules:
      - "עמיד בחום; מושלם להרטבת בשרים (Basting) בצליה."
      - "הגבעולים העדינים יכולים להיכנס ישירות לצירים."
    prep_notes: "הפשטת עלים במשיכה נגד כיוון הצמיחה."

  herb_parsley:
    name: "פטרוזיליה שטוחה"
    category: "עשבי תיבול"
    base_rules:
      - "עשב רך; הוספה ברגע האחרון של הבישול או כעיטור טרי."
      - "הגבעולים מכילים טעם עז - מתאימים לבישול מוקדם."
    prep_notes: "ייבוש מוחלט לפני קיצוץ למניעת ריסוק והשחרה."

  herb_basil:
    name: "בזיליקום טרי"
    category: "עשבי תיבול"
    base_rules:
      - "רגיש מאוד לחמצון ולהשחרה במגע עם חום וסכין קהה."
      - "קריעה ידנית עדיפה על חיתוך; שילוב בסוף המנה."
    prep_notes: "הימנעות ממוחלטת מקירור מתחת ל-10°C (משחיר במקרר)."

preparations:
  # ============================================================================
  # TECHNIQUES & PREPARATIONS (טכניקות הכנה מקדימות)
  # ============================================================================
  brining_wet:
    name: "השריה בתמיסת מלח (Wet Brining)"
    description: "השריית חלבונים רזים בתמיסת מים ומלח (5-6%) לשינוי מבנה החלבון ונעילת נוזלים פנימית."
    applicable_categories: ["עופות", "חזיר", "דגים"]

  brining_dry:
    name: "המלחה יבשה (Dry Brining)"
    description: "פיזור מלח גס ישירות על שטח פנים של הבשר ושהייה של שעות בקירור לריכוז טעמים וייבוש העור."
    applicable_categories: ["בקר", "עופות", "טלה"]

  blanching:
    name: "חליטה (Blanching)"
    description: "בישול קצרצר במי מלח רותחים ומעבר מיידי לאמבט מי קרח לקיבוע צבע, מרקם וטיהור טעמים."
    applicable_categories: ["ירקות - ירוקים", "ירקות - מצליבים", "עופות"]

  deglazing:
    name: "דגלאז' (Deglazing)"
    description: "מזיגת נוזל קר (יין, ציר, מים) למחבת חמה להמסת משקעי השומן והחלבון המקורמלים (Fond)."
    applicable_categories: ["רטבים", "בקר", "עופות"]

  sweating:
    name: "הזעה (Sweating)"
    description: "בישול ירקות שורש ובצלים בשומן בחום נמוך עם מכסה, להוצאת נוזלים וריכוך ללא השחמה."
    applicable_categories: ["ירקות - בצלים", "ירקות - שורשים"]

cooking_methods:
  # ============================================================================
  # COOKING METHODS (שיטות בישול עיקריות)
  # ============================================================================
  pan_sear:
    name: "צריבה במחבת (Pan Sear)"
    description: "העברת חום באמצעות הולכה ישירה ממשטח מתכת לוהט עם מעט שומן להפעלת תגובת מייאר מלאה."
    default_instructions:
      - "חמם מחבת ברזל יצוק או נירוסטה עד סף עישון קל של השומן."
      - "הנח את הנתח בתנועה המתרחקת מגופך למניעת התזת שומן."
      - "הימנע לחלוטין מהזזת הנתח בדקות הראשונות עד לשחרור טבעי מהמתכת."
    nudge_rules:
      - condition: "surface_wet"
        message: "עצור מיד! שטח הפנים לח. מים גורמים לאידוי במקום צריבה. יבש את הנתח עכשיו עם נייר סופג."
      - condition: "pan_crowded"
        message: "המחבת עמוסה מדי! הטמפרטורה צונחת והנוזלים יצטברו. צרוב בנגלות נפרדות."
      - condition: "oil_smoking_heavily"
        message: "השמן מעשן יתר על המידה ונשרף. הרחק את המחבת מהלהבה לכמה שניות והנמך חום."

  oven_roast:
    name: "צלייה בתנור (Oven Roast)"
    description: "בישול בחום יבש והסעת אוויר סגורה המקיפה את חומר הגלם מכל צדדיו."
    default_instructions:
      - "חמם את התנור לטמפרטורה הרצויה מראש (לפחות 20 דקות להתייצבות תרמית)."
      - "מקם את התבנית בשליש המרכזי של התנור לפיזור חום מאוזן."
      - "השתמש ברשת צלייה מוגבהת במידת הצורך לאפשר תנועת אוויר תחת הנתח."
    nudge_rules:
      - condition: "oven_cold"
        message: "התנור טרם הגיע לחום היעד. הכנסת הנתח כעת תגרום לאיבוד עסיסיות ללא השחמה."
      - condition: "skin_rubbery"
        message: "העור לא מקבל פריכות? הגבר חום ל-220°C ב-7 הדקות האחרונות לצורך השחמה מואצת."

  grill_direct:
    name: "צלייה בגריל ישיר (Direct Grilling)"
    description: "חשיפה לקרינת חום אדירה מגחלים או מבערי גז ישירים לפיתוח טעמי עישון וחריכה."
    default_instructions:
      - "הברש ושמן את רשת הצלייה כשהיא לוהטת לחלוטין."
      - "עבוד לפי אזורי חום: אזור צריבה חם ואזור עקיף מתון למנוחה."
      - "סגור את מכסה הגריל לשמירת חום היקפי ועשן."
    nudge_rules:
      - condition: "flare_up"
        message: "להבות שומן אוחזות בבשר! הזז את הנתח מיד לאזור החום העקיף עד להרגעת האש."
      - condition: "meat_sticking"
        message: "הבשר מתנגד לרשת? אל תמשוך בכוח. תגובת מייאר תשחרר אותו ברגע שייווצר הקרום."

  deep_fry:
    name: "טיגון עמוק (Deep Fry)"
    description: "שיקוע מלא של חומר גלם בשמן עמוק בטמפרטורה שבין 160°C ל-190°C ליצירת מעטפת אטומה ופריכה."
    default_instructions:
      - "מדוד חום שמן במדחום מדויק טרם הכנסת המזון."
      - "הורד את חומר הגלם בשלבים למניעת צניחה דרסטית בחום השמן."
      - "הוצא לרשת צינון מוגבהת והמלח מיד בעוד השמן רותח על המעטפת."
    nudge_rules:
      - condition: "temp_below_160"
        message: "השמן התקרר מדי! המזון יספוג שמן ויהפוך סמרטוטי. המתן להתאוששות הטמפרטורה."
      - condition: "draining_on_paper"
        message: "הימנע מהנחה ישירה על נייר סופג - האדים שמתחת יהפכו את התחתית לסמרטוטית. השתמש ברשת!"

  stir_fry:
    name: "הקפצה בווק (Stir Fry)"
    description: "בישול בחום קיצוני תוך כדי תנועה בלתי פוסקת של חומרי גלם חתוכים קטן ודק (טכניקת Wok Hei)."
    default_instructions:
      - "חמם את הווק עד להעלאת עשן לפני מזיגת השמן בדפנות."
      - "בשל בסדר קפדני: חלבון תחילה (והוצאה), ירקות קשים, ירקות רכים, חזרה ואיחוד ברוטב."
      - "שמור על תנועה מתמדת של המזון בעזרת כף ייעודית או הקפצה אווירית."
    nudge_rules:
      - condition: "ingredients_uneven"
        message: "החיתוך אינו שווה בגודלו! חלק מהירקות יישרפו בעוד האחרים יישארו נאים. יישר קו בחיתוך."
      - condition: "sauce_burning"
        message: "מזוג רטבים על דפנות הווק הלוהטות ולא ישירות על מרכז המסה לאידוי וקרמליזציה מיידית."

  sous_vide:
    name: "סו-וויד (Sous-vide)"
    description: "בישול במארז ואקום בתוך אמבט מים מווסת בטמפרטורה מדויקת לחלוטין לפרקי זמן מוגדרים."
    default_instructions:
      - "אטום את המוצר בשקית ואקום ייעודית ללא בועות אוויר כלל."
      - "וודא שקיעת השקית במים במחזור תרמי אחיד."
      - "קרר מיד באמבט קרח אם אינך צורב ומגיש באופן מיידי."
    nudge_rules:
      - condition: "bag_floating"
        message: "השקית צפה על פני המים! יש כיס אוויר שמונע בישול אחיד. הוסף משקולת או אטום מחדש."
      - condition: "no_sear_finish"
        message: "הבשר יצא מהשקית חיוור. נדרשת צריבה קיצונית ומהירה של 45 שניות במחבת לוהטת לפיתוח צבע."

  steam:
    name: "אידוי (Steaming)"
    description: "בישול עדין באמצעות אדי מים מוליכי חום ללא מגע ישיר עם נוזל הבישול, לשימור מירבי של ערכים ומבנה."
    default_instructions:
      - "וודא רתיחה מלאה והעלאת אדים עשירה לפני הכנסת סלסילת האידוי."
      - "שמור על אטימות המכסה למניעת בריחת קיטור."
      - "רפד את תחתית הסלסילה בנייר אפייה מחורר או עלי כרוב למניעת הידבקות."
    nudge_rules:
      - condition: "water_dry"
        message: "סיר המים שמתחת לסלסילה מתרוקן! הוסף מים רותחים מיד למניעת שריפת תחתית הסיר."
      - condition: "oversteaming_veg"
        message: "הירק מתחיל לאבד את צבעו העז לצבע זית עמום. הוצא מיד - הוא מתבשל יתר על המידה!"

  braise:
    name: "בישול ארוך / צלי קדירה (Braise)"
    description: "שיטה משולבת: צריבה יבשה עמוקה בחום גבוה, ואחריה בישול איטי בנוזל חלקי בכלי סגור ואטום."
    default_instructions:
      - "צרוב את הנתח עמוקות מכל צדדיו להפקת משקעים עשירים."
      - "הוצא את הנתח, בצע דגלאז' עם יין או ציר, והחזר את הבשר."
      - "שמור על מפלס נוזל המגיע לחצי או שני-שליש מגובה הנתח, ובשל ברתיחה מינימלית."
    nudge_rules:
      - condition: "boiling_vigorously"
        message: "הנוזל רותח בעוצמה רבה מדי! הרתיחה תקשה את סיבי הבשר ותייבש אותו. הנמך לבעבוע עדין (Simmer)."
      - condition: "liquid_evaporated"
        message: "נוזל הבישול מצטמצם מהר מדי. אטום טוב יותר את המכסה והוסף מעט ציר חם."

  boil_simmer:
    name: "בישול במים / בישול עדין (Boil / Simmer)"
    description: "בישול בתוך נוזל שופע (מים, ציר, חלב) בטמפרטורת רתיחה (100°C) או בעבוע עדין (85-95°C)."
    default_instructions:
      - "הבא מים לרתיחה מבעבעת והוסף מלח בנדיבות."
      - "שלוט בעוצמת הלהבה לפי חומר הגלם (עמילנים דורשים תנועה; חלבונים דורשים עדינות)."
      - "שמור על יחס מספק של מים לכמות המזון למניעת ירידת חום קיצונית."
    nudge_rules:
      - condition: "water_unsalted"
        message: "המים אינם מומלחים! זו ההזדמנות היחידה להחדיר טעם עמוק לתוך עמילנים ופסטה. הוסף מלח עכשיו."
      - condition: "scum_forming"
        message: "קצף חלבונים עכור צף על פני הנוזל. קפה (Skim) אותו עם מצקת לקבלת ציר צלול ונקי."

  raw_cure:
    name: "נא / כבישה קרה (Raw / Curing)"
    description: "הכנה ללא חום תרמי, תוך שימוש בסכינאות מדויקת, חומציות (דנטורציה) או המלחה (אוסמוזה)."
    default_instructions:
      - "עבוד על קרש חיתוך וסכין מקוררים ומחוטאים בקפידה."
      - "שמור על שרשרת קירור רציפה (מתחת ל-4°C) עד שנייה לפני ההגשה."
      - "חתוך במשיכה אחת חלקה ללא ניסור למניעת פציעת תאי החלבון."
    nudge_rules:
      - condition: "acid_too_long"
        message: "הדג יושב במיץ לימון מעל 15 דקות! החומצה 'מבשלת' את החלבון והופכת אותו יבש ומתפורר. הגש מיד."
      - condition: "knife_dull"
        message: "הסכין שלך קורעת את הסיבים במקום לחתוך בצלילות. השחז את הסכין עכשיו."

recipe_paths:
  # ============================================================================
  # RECIPE PATHS (ניתובים קולינריים משולבים)
  # ============================================================================
  - title: "חזה עוף צרוב במחבת עם חמאת טימין"
    ingredient_ref: "chicken_breast"
    method_ref: "pan_sear"
    specific_steps:
      - step_number: 1
        action: "ייבש את חזה העוף ביסודיות עם נייר סופג, שטוח קלות לעובי אחיד של 2 ס\"מ, והמלח בנדיבות."
        chef_guidance: "האם שטח הפנים יבש לחלוטין למגע? זכור: רטיבות היא האויב המושבע של תגובת מייאר."
        time_estimate: "3 דקות"
      - step_number: 2
        action: "חמם כף שמן במחבת נירוסטה או ברזל יצוק על אש בינונית-גבוהה עד לסף עישון, והנח את החזה."
        chef_guidance: "אל תיגע בעוף! אל תזיז אותו ואל תציץ מתחת. תן לקרום להתגבש במשך 3 דקות שלמות."
        time_estimate: "3 דקות"
      - step_number: 3
        action: "הפוך את הנתח, הוסף 20 גרם חמאה, שן שום מעוכה וענף טימין, והטה את המחבת להרטבת הנתח בכף (Basting)."
        chef_guidance: "האם החמאה מקציפה ומשחימה קלות בניחוח אגוזי? השקה ברציפות את החלק העליון."
        time_estimate: "2.5 דקות"
      - step_number: 4
        action: "מדוד טמפרטורה פנימית עם מדחום במרכז החלק העבה (יעד: 73°C-74°C) והעבר לקרש עץ."
        chef_guidance: "עצור! אל תפרוס אותו עכשיו. תן לו לנוח 4 דקות כדי שהמיצים יתייצבו מחדש בתוך הסיבים."
        time_estimate: "4 דקות"

  - title: "סטייק אנטרקוט בגריל ישיר"
    ingredient_ref: "beef_ribeye"
    method_ref: "grill_direct"
    specific_steps:
      - step_number: 1
        action: "הוצא את הסטייק מהמקרר 30 דקות לפני הצלייה, המלח במלח ים אטלנטי גס מכל צדדיו."
        chef_guidance: "האם הנתח איבד את צינת המקרר והגיע לטמפרטורת החדר? צליית בשר קפוא תגרום למרכז להישאר נא וקר מדי."
        time_estimate: "30 דקות"
      - step_number: 2
        action: "הנח את הסטייק על החלק הלוהט ביותר ברשת הגריל בזווית של 45 מעלות לפסים."
        chef_guidance: "שומע את הרחישה העזה? אם אינך שומע צריבה עוצמתית ברגע המגע, הרשת שלך אינה חמה מספיק!"
        time_estimate: "2 דקות"
      - step_number: 3
        action: "סובב את הסטייק ב-90 מעלות על אותו הצד ליצירת רשת פסים מושלמת (Diamond grill marks)."
        chef_guidance: "האם השומן התוך-שרירי מטפטף ומצית להבות? אם האש חזקה מדי, הזז אותו סנטימטר הצידה."
        time_estimate: "2 דקות"
      - step_number: 4
        action: "הפוך את הסטייק לצד השני וצרוב עד הגעה ל-54°C במרכז (דרגת מדיום-רר מדויקת)."
        chef_guidance: "השתמש במדחום ליבה דיגיטלי. בדיקה לפי תחושת אצבע אינה מספקת ברמת דיוק מקצועית."
        time_estimate: "3 דקות"
      - step_number: 5
        action: "העבר את הסטייק לרשת מנוחה למשך 6 דקות לפני פריסה."
        chef_guidance: "תן ללחץ התאי לרדת ולסיבים להירגע. כל טיפת נוזל שתאבד בפריסה מוקדמת היא פשע קולינרי."
        time_estimate: "6 דקות"

  - title: "פילה סלמון צרוב בעור פריך"
    ingredient_ref: "fish_salmon_fillet"
    method_ref: "pan_sear"
    specific_steps:
      - step_number: 1
        action: "גרד את עור הסלמון עם גב סכין להסרת שאריות לחות, יבש היטב בנייר, וחרוץ 3 חריצים רדודים בעור."
        chef_guidance: "האם העור מרגיש יבש לחלוטין כמו קלף? זהו הסוד לעור דק ומתפצח."
        time_estimate: "2 דקות"
      - step_number: 2
        action: "הנח את הדג במחבת טפלון או נירוסטה מחוממת היטב עם שמן זית, כשצד העור כלפי מטה, ולחץ עם מרית."
        chef_guidance: "לחץ בעדינות במשך 20 השניות הראשונות! הדג נוטה להתקמר, ואנו רוצים מגע רציף ומושלם של העור."
        time_estimate: "1 דקה"
      - step_number: 3
        action: "הנמך את הלהבה לבינונית והמשך לבשל 80% מזמן הבישול על צד העור בלבד."
        chef_guidance: "הבט בצד הפילה: האם אתה רואה את שינוי הצבע מטפס באטיות מאטום לוורוד בהיר עד לגובה שני-שליש?"
        time_estimate: "4 דקות"
      - step_number: 4
        action: "הפוך את הדג בעדינות לצד הבשר ל-45 שניות אחרונות בלבד, כבה את האש והעבר לצלחת."
        chef_guidance: "אל תייבש אותו! המרכז צריך להישאר כתום מבריק, רך וקרמי (כ-50°C)."
        time_estimate: "45 שניות"

  - title: "אסאדו בקר בבישול ארוך בקדירה"
    ingredient_ref: "beef_short_ribs"
    method_ref: "braise"
    specific_steps:
      - step_number: 1
        action: "חמם סיר יצוק כבד (Dutch Oven) עם 2 כפות שמן, וצרוב את נתחי האסאדו היטב מכל 6 הפאות."
        chef_guidance: "האם קיבלת צבע חום עמוק ומהגוני מכל צד? אל תמהר - זה הבסיס לכל העומק של הרוטב."
        time_estimate: "10 דקות"
      - step_number: 2
        action: "הוצא את הבשר, הוסף קוביות בצל, גזר וסלרי (Mirepoix), והזע אותם עד להזהבה קלה."
        chef_guidance: "גרד היטב את תחתית הסיר בכף עץ. כל הטעם של צריבת הבשר חבוי שם."
        time_estimate: "6 דקות"
      - step_number: 3
        action: "מזוג פנימה כוס יין אדום יבש (Deglazing) וצמצם בחצי תוך קרצוף המשקעים."
        chef_guidance: "האם ריח האלכוהול החריף התפוגג והותיר ניחוח ענבים פירותי עמוק?"
        time_estimate: "4 דקות"
      - step_number: 4
        action: "החזר את הבשר, הוסף ציר בקר עד 2/3 מגובה הנתחים, כסה הרמטית והעבר לתנור ב-140°C."
        chef_guidance: "בדוק לאחר שעה: הנוזל צריך לבעבע עדינות בלבד (בועות קטנות בשוליים), בשום אופן לא רתיחה סוערת."
        time_estimate: "3.5 שעות"
      - step_number: 5
        action: "בדוק רכות בעזרת נעיצת מזלג (Fork-tender) והרם את הבשר בעדינות למניעת התפרקות."
        chef_guidance: "האם המזלג מחליק פנימה ומסתובב ללא כל התנגדות? אם יש מתח בסיבים, החזר לעוד 30 דקות."
        time_estimate: "5 דקות"

  - title: "רוסטביף סינטה בתנור"
    ingredient_ref: "beef_sirloin"
    method_ref: "oven_roast"
    specific_steps:
      - step_number: 1
        action: "קשור את נתח הסינטה בחוט קצבים במרווחים של 2 ס\"מ, מרח בחרדל דיז'ון, פלפל שחור גרוס ומלח."
        chef_guidance: "הקשירה שומרת על גליל דחוס ועובי שווה, מה שמבטיח שוליים ומרכז באותה דרגת עשייה."
        time_estimate: "5 דקות"
      - step_number: 2
        action: "צרוב את הנתח במחבת כבדה לוהטת מכל צדדיו כולל פס השומן עד להשחמה מלאה."
        chef_guidance: "הקפד להעמיד את הנתח על פס השומן כדי להמיס אותו ולפתח פריכות ראשונית."
        time_estimate: "6 דקות"
      - step_number: 3
        action: "העבר לתבנית עם רשת בתנור שחומם מראש ל-120°C (שיטת הצלייה האיטית העדינה)."
        chef_guidance: "חום נמוך מונע את התופעה של שוליים אפורים יבשים ומעניק אדמומיות אחידה מקיר לקיר."
        time_estimate: "45 דקות"
      - step_number: 4
        action: "הוצא מהתנור ברגע שהמדחום מראה 53°C, וכסה ברפיון בנייר כסף למנוחה."
        chef_guidance: "הטמפרטורה תמשיך לעלות ב-2-3 מעלות בזמן המנוחה (Carryover cooking). אל תחרוג מזה!"
        time_estimate: "15 דקות"

  - title: "פרגיות מוקפצות בווק עם זוקיני ובצל"
    ingredient_ref: "chicken_thighs_boneless"
    method_ref: "stir_fry"
    specific_steps:
      - step_number: 1
        action: "חתוך את הפרגית לרצועות שוות בעובי 1 ס\"מ, ערבב עם כפית קורנפלור ומעט סויה (Velveting)."
        chef_guidance: "הקורנפלור יוצר שכבת מגן שנועלת את הלחות ומונעת מסיבי העוף להתייבש בחום הווק."
        time_estimate: "5 דקות"
      - step_number: 2
        action: "חמם ווק עד להעלאת עשן, הוסף שמן עתיר נקודת עישון, וצרוב את העוף בשכבה אחת ללא הזזה למשך דקה."
        chef_guidance: "תן לעוף להיחרך קלות! רק לאחר מכן הקפץ במרץ למשך דקה נוספת והוצא לצלחת צדדית."
        time_estimate: "2 דקות"
      - step_number: 3
        action: "הוסף לווק בצל סגול פרוס ורצועות זוקיני; הקפץ ברציפות על הלהבה הכי חזקה של הכיריים."
        chef_guidance: "האם הירקות נעים כל הזמן במחבת? הירק צריך לקבל נגיעות שרופות בקצוות אך להישאר קראנצ'י."
        time_estimate: "2 דקות"
      - step_number: 4
        action: "החזר את העוף, הוסף שום כתוש ורוטב סויה-ג'ינג'ר, והקפץ 30 שניות עד לצמצום וציפוי מבריק."
        chef_guidance: "האם הרוטב מבעבע ומצפה את המרכיבים בזיגוג מבריק (Glaze) מבלי להיפרד לשלולית?"
        time_estimate: "30 שניות"

  - title: "טרטר טונה אדומה קלאסי"
    ingredient_ref: "fish_tuna_loin"
    method_ref: "raw_cure"
    specific_steps:
      - step_number: 1
        action: "וודא שנתח הטונה קר מאוד (הנח 10 דקות במקפיא לפני), וקצוץ לקוביות זעירות ואחידות של 5 מ\"מ."
        chef_guidance: "השתמש בסכין שף מושחזת כאיזמל. אין ללחוץ ולמעוך את הדג, אלא לפרוס במשיכה חלקה."
        time_estimate: "5 דקות"
      - step_number: 2
        action: "קצוץ שאלוט, עירית וצלפים ביחס זעיר ומדויק ביחס לדג והעבר לקערת נירוסטה המונחת על קרח."
        chef_guidance: "עבודה מעל אמבט קרח (Bain-marie קר) שומרת על הטמפרטורה ומונעת התחמצנות של שומן הדג."
        time_estimate: "3 דקות"
      - step_number: 3
        action: "תבל בשמן זית כתית מעולה, פלפל שחור גרוס ומלח מאלדון. הוסף מיץ לימון סחוט טרי ממש לפני ההגשה."
        chef_guidance: "אל תיתן לחומצת הלימון לשבת עם הדג! חומצה מפרקת את חלבוני הטונה והופכת את צבעם מאדום לאפור."
        time_estimate: "1 דקה"

  - title: "כרובית שלמה צלויה בתנור"
    ingredient_ref: "veg_cauliflower"
    method_ref: "oven_roast"
    specific_steps:
      - step_number: 1
        action: "קצוץ את הגבעול המרכזי של הכרובית כך שתעמוד יציב, ובשל אותה בסיר מים מומלחים רותחים במשך 7 דקות."
        chef_guidance: "חליטה מקדימה מרככת את הליבה הדחוסה, כך שלא נקבל מעטפת שרופה ומרכז קשה וחי."
        time_estimate: "10 דקות"
      - step_number: 2
        action: "הוצא, יבש היטב במשך 5 דקות באוויר, והברש בנדיבות בתערובת של שמן זית, חמאה מומסת ומלח גס."
        chef_guidance: "האם האדים התנדפו והכרובית יבשה למגע? שמן לא יידבק לשטח פנים נוטף מים."
        time_estimate: "5 דקות"
      - step_number: 3
        action: "הכנס לתנור שחומם מראש ל-200°C על גבי תבנית אפייה למשך 35 דקות עד להשחמה אחידה."
        chef_guidance: "האם שטח הפנים מקבל גוון חום עמוק וריח אגוזי? אם יש צורך, הפעל טורבו ב-5 הדקות האחרונות."
        time_estimate: "35 דקות"
      - step_number: 4
        action: "נעץ סכין במרכז: היא צריכה להחליק פנימה כמו לתוך חמאה רכה."
        chef_guidance: "הגש מיד עם טחינה גולמית או גרידת פרמז'ן מעל."
        time_estimate: "1 דקה"

  - title: "חציל בלאדי שרוף באש גלויה"
    ingredient_ref: "veg_eggplant"
    method_ref: "grill_direct"
    specific_steps:
      - step_number: 1
        action: "חורר את קליפת החציל 4-5 פעמים בעזרת מזלג והנח אותו ישירות מעל להבת גז גלויה או גחלים לוחשות."
        chef_guidance: "החירור קריטי! אי-חירור של החציל יוביל להצטברות לחץ פנימי קיצוני והתפוצצות מסוכנת."
        time_estimate: "1 דקה"
      - step_number: 2
        action: "צלה במשך כ-15-20 דקות תוך כדי סיבוב החציל במלקחיים כל 4 דקות."
        chef_guidance: "האם הקליפה מתפחמת לחלוטין ונראית פריכה ושרופה? אל תפחד מהשחור - משם מגיע כל טעם העישון."
        time_estimate: "18 דקות"
      - step_number: 3
        action: "הורד את החציל כאשר הוא קורס לחלוטין תחת משקלו ורך כספוג, והנח במסננת לניקוז נוזלים מרים."
        chef_guidance: "פתח חריץ אורכי ותן למים השחורים הכהים לצאת במשך 15 דקות. זה ימנע טעם לוואי מר וחומצי."
        time_estimate: "15 דקות"
      - step_number: 4
        action: "גרד את בשר החציל בכף עץ והפרד מחלקיקי הקליפה המפוחמת."
        chef_guidance: "בשום אופן אל תשטוף את החציל במים לניקוי! שטיפה תמחק כליל את כל ארומת העישון שעבדנו עליה."
        time_estimate: "3 דקות"

  - title: "פילה דניס מאודה ברוטב סויה, ג'ינג'ר ובצל ירוק"
    ingredient_ref: "fish_sea_bream_fillet"
    method_ref: "steam"
    specific_steps:
      - step_number: 1
        action: "הנח את פילה הדניס על צלחת חסינת חום מרופדת ברצועות ג'ינג'ר ובצל ירוק."
        chef_guidance: "הריפוד מונע הידבקות ומאפשר לאדי המים לחדור גם מתחת לפילה."
        time_estimate: "2 דקות"
      - step_number: 2
        action: "הכנס את הצלחת לתוך סלסילת אידוי מבמבוק מעל סיר מים רותחים בעוצמה, וכסה במכסה."
        chef_guidance: "האם האדים יוצאים בדחיסה מפתחי הסלסילה? בישול עדין זה דורש זרימת אדים רציפה ולוהטת."
        time_estimate: "6 דקות"
      - step_number: 3
        action: "בדוק מוכנות: בשר הדג צריך להפוך ללבן אטום ולהיפרד בקלות בלחיצה עדינה (Flaking)."
        chef_guidance: "היזהר מאידוי יתר שהופך דגים לבנים לגומי. 6-7 דקות מספיקות בהחלט לפילה בעובי סטנדרטי."
        time_estimate: "1 דקה"
      - step_number: 4
        action: "הוצא, פזר מעל ערימת ג'ינג'ר ובצל ירוק חתוכים לשערות דקות, ומזוג מעל שמן שומשום רותח."
        chef_guidance: "שומע את התסיסה של השמן החם על הירוקים? זה פותח את השמנים האתריים ויוצר רוטב מיידי."
        time_estimate: "1 דקה"

  - title: "ריזוטו מילאנזה קלאסי"
    ingredient_ref: "grain_rice_arborio"
    method_ref: "pan_sear"
    specific_steps:
      - step_number: 1
        action: "טגן קלות שאלוט קצוץ דק בחמאה מבלי להזהיב, הוסף את אורז הארבוריו וקלה אותו יבש (Tostatura)."
        chef_guidance: "גע בגרגירי האורז: האם הם חמים למגע ושקופים בקצוות עם נקודה לבנה במרכז? זה הזמן לנוזל."
        time_estimate: "3 דקות"
      - step_number: 2
        action: "מזוג חצי כוס יין לבן יבש וערבב ברציפות עד לספיגה והתאיידות מוחלטת של היין."
        chef_guidance: "האם ריח החמיצות של היין נרגע? אל תוסיף ציר עד שהסיר כמעט יבש לחלוטין."
        time_estimate: "2 דקות"
      - step_number: 3
        action: "הוסף ציר עוף רותח מהול בזעפרן, מצקת אחת בכל פעם, תוך כדי ערבוב מתמיד בכף עץ."
        chef_guidance: "חובה שהציר יהיה רותח! ציר קר מנחית את טמפרטורת הבישול והורס את שחרור העמילן ההדרגתי."
        time_estimate: "16 דקות"
      - step_number: 4
        action: "הורד מהאש ברמת אל-דנטה מושלמת, הוסף חמאה קרה חתוכה לקוביות ופרמז'ן מגורר, וערבב במרץ (Mantecatura)."
        chef_guidance: "נער את המחבת קדימה ואחורה: האם נוצר גל רך וקרמי (All'onda)? אם זה נוקשה מדי, הוסף כף ציר."
        time_estimate: "2 דקות"

  - title: "בטטה צלויה שלמה בקרמליזציה איטית"
    ingredient_ref: "veg_sweet_potato"
    method_ref: "oven_roast"
    specific_steps:
      - step_number: 1
        action: "שטוף את הבטטה היטב, נגב, וחורר אותה עם סכין ב-4 מוקדים שונים."
        chef_guidance: "חירור מאפשר לאדי המים הפנימיים להשתחרר ומפתח ריכוז סוכרים ללא פיצוץ הקליפה."
        time_estimate: "1 דקה"
      - step_number: 2
        action: "הנח את הבטטה על תבנית מרופדת בנייר אפייה והכנס לתנור ב-170°C למשך שעה ורבע."
        chef_guidance: "חום מתון מפעיל את אנזים האמילאז שממיר עמילנים לסוכר מלטוז. חום גבוה מדי ישרוף את הסוכר בטרם יתפתח."
        time_estimate: "75 דקות"
      - step_number: 3
        action: "בדוק האם סירופ סוכר חום ומקורמל מתחיל לזלוג מתוך החריצים אל נייר האפייה."
        chef_guidance: "לחץ קלות עם מגבת על הבטטה: האם היא רכה לחלוטין ונכנעת למגע כמו כרית פוך?"
        time_estimate: "2 דקות"
      - step_number: 4
        action: "חתוך לאורך, פתח את הבשר המהביל, פזר פתיתי מלח מאלדון וכפית חמאה קרה."
        chef_guidance: "הניגוד בין מתיקות הבטטה החמה למליחות הפריכה של המלח הוא המפתח לאיזון המנה."
        time_estimate: "1 דקה"

  - title: "ברוקולי מוקפץ בשום, שמן זית וצ'ילי"
    ingredient_ref: "veg_broccoli"
    method_ref: "stir_fry"
    specific_steps:
      - step_number: 1
        action: "חתוך את הברוקולי לתפרחות בינוניות וחלוט במים רותחים מומלחים מאוד למשך 90 שניות בלבד."
        chef_guidance: "האם הכנת קערה עם מי קרח בצד? עצירת הבישול המיידית היא ששומרת על הגוון הירקן הזוהר."
        time_estimate: "3 דקות"
      - step_number: 2
        action: "סנן את הברוקולי ויבש אותו לחלוטין מנוזלי החליטה."
        chef_guidance: "אם תזרוק ברוקולי רטוב למחבת עם שמן חם, הוא יתבשל באדים ולא ייחרך. יבש אותו!"
        time_estimate: "2 דקות"
      - step_number: 3
        action: "חמם מחבת עם 3 כפות שמן זית, הוסף פרוסות שום וטבעות צ'ילי ל-20 שניות עד להפצת ריח."
        chef_guidance: "שמור על השום! אסור לו להשחים - שום זהוב הופך תוך שנייה לשום מר ושרוף."
        time_estimate: "20 שניות"
      - step_number: 4
        action: "הוסף את הברוקולי על להבה חזקה והקפץ במרץ במשך 2 דקות עד לקבלת סימני חריכה קלים בקצוות."
        chef_guidance: "נגוס בתפרחת: האם יש התנגדות נעימה של קראנץ' (אל-דנטה)? הורד מהאש מיד וסחוט לימון."
        time_estimate: "2 דקות"

  - title: "פילה בקר סו-וויד עם צריבת מחבת הפוכה"
    ingredient_ref: "beef_tenderloin"
    method_ref: "sous_vide"
    specific_steps:
      - step_number: 1
        action: "תבל את נתח הפילה במלח גס, אטום בשקית ואקום עם ענף טימין, ושקע באמבט מים ב-52°C."
        chef_guidance: "וודא שאין כיסי אוויר בשקית. אטימת הוואקום מבטיחה מגע תרמי אחיד בכל נקודה בבשר."
        time_estimate: "1.5 שעות"
      - step_number: 2
        action: "הוצא את הנתח מהשקית, והספג כל טיפת נוזל משטח הפנים באמצעות 3 שכבות נייר סופג."
        chef_guidance: "הבשר ייראה חיוור ואפרפר - אל תיבהל. כדי לייצר קרמליזציה מהירה, הוא חייב להיות יבש לחלוטין."
        time_estimate: "3 דקות"
      - step_number: 3
        action: "חמם מחבת ברזל יצוק לחום קיצוני עד עשן כבד, הוסף שמן בעל נקודת עישון גבוהה וצרוב 45 שניות מכל צד."
        chef_guidance: "אל תחרוג מ-45 שניות! הליבה כבר בטמפרטורה המושלמת; אנו רוצים צבע חיצוני בלבד ללא בישול פנימי נוסף."
        time_estimate: "1.5 דקות"
      - step_number: 4
        action: "הוסף קוביית חמאה בשניות האחרונות, צפה את הסטייק, והגש באופן מיידי ללא צורך במנוחה ממושכת."
        chef_guidance: "בשר סו-וויד אינו סובל מלחץ תרמי משמעותי, ולכן אין צורך במנוחה ארוכה. פרוס והגש."
        time_estimate: "1 דקה"

  - title: "שווארמה הודו מוקפצת במחבת ברזל"
    ingredient_ref: "turkey_thigh"
    method_ref: "pan_sear"
    specific_steps:
      - step_number: 1
        action: "פרוס את ירך ההודו לרצועות דקות מאוד בניצב לכיוון הסיב, ותבל בתערובת תבלינים, שום ושמן."
        chef_guidance: "האם נתת לבשר לספוג את התבלינים 20 דקות? השמן במרינדה ישמש כחומר מוליך החום העיקרי."
        time_estimate: "20 דקות"
      - step_number: 2
        action: "חמם מחבת ברזל יצוקה עד לרמת חום מקסימלית, ופזר רבע מכמות הבשר בשכבה בודדת."
        chef_guidance: "אל תעמיס! צפיפות יתר במחבת תהפוך את השווארמה שלך לבשר מכובס בנוזלים של עצמו."
        time_estimate: "2 דקות"
      - step_number: 3
        action: "צרוב במשך 2 דקות ללא תנועה עד לקבלת שוליים פריכים וחרוכים, ואז הפוך במהירות לדקה נוספת."
        chef_guidance: "האם יש ריח אופייני של צלייה מזרח-תיכונית באוויר? הקריספיות בשוליים היא כל המהות כאן."
        time_estimate: "1.5 דקות"
      - step_number: 4
        action: "העבר לכלי מכוסה, חזור על הפעולה עם יתרת הבשר, ואחד את כל הנגלות לפני ההגשה."
        chef_guidance: "ערבב את כל הבשר הצרוב עם המיצים שהצטברו בכלי לקבלת עסיסיות מקסימלית."
        time_estimate: "2 דקות"

  - title: "המבורגר קלאסי צרוב על פלנצ'ה"
    ingredient_ref: "beef_ground"
    method_ref: "pan_sear"
    specific_steps:
      - step_number: 1
        action: "עצב קציצה במשקל 200 גרם מבקר עם 20% שומן בדחיסה עדינה בלבד, וצור שקע קטן במרכזה."
        chef_guidance: "אל תדחס את הבשר כאילו היה בצק! אווריריות בין חלקיקי הבשר הטחון שומרת על עסיסיות רכה."
        time_estimate: "2 דקות"
      - step_number: 2
        action: "הנח את הקציצה על מחבת יצוקה לוהטת ויבשה, והמלח בנדיבות במלח דק רק ברגע המפגש עם החום."
        chef_guidance: "לעולם אל תמלח בשר טחון מראש - מלח מפרק חלבונים ויהפוך את ההמבורגר שלך לנקניקייה צפופה."
        time_estimate: "1 דקה"
      - step_number: 3
        action: "צרוב 3.5 דקות מצד ראשון. הפוך פעם אחת בלבד בעזרת מרית מתכת חדה."
        chef_guidance: "בשום פנים ואופן אל תלחץ עם המרית על הקציצה! לחיצה סוחטת את כל השומן והעסיסיות אל המחבת."
        time_estimate: "3.5 דקות"
      - step_number: 4
        action: "הנח פרוסת גבינה מעל, כסה את המחבת במכסה עגול והוסף כפית מים ליצירת אדים ממיסים ל-60 שניות."
        chef_guidance: "האם הגבינה נמסה לחלוטין ועוטפת את הקציצה כמו מעיל מבריק? הוצא למנוחה של 3 דקות בלחמנייה."
        time_estimate: "1.5 דקות"

  - title: "שרימפס מוקפץ בחמאת שום, יין לבן ופטרוזיליה"
    ingredient_ref: "seafood_shrimp"
    method_ref: "pan_sear"
    specific_steps:
      - step_number: 1
        action: "קלף את השרימפס, הסר את הווריד השחור בגב, ויבש היטב את שטח הפנים בנייר סופג."
        chef_guidance: "האם הוצאת את הווריד במלואו? שאריות חול פוגמות לחלוטין במרקם המעודן של פירות הים."
        time_estimate: "4 דקות"
      - step_number: 2
        action: "חמם כף שמן זית במחבת רחבה על אש גבוהה, והנח את השרימפס בשכבה בודדת ומרווחת למשך דקה."
        chef_guidance: "האם החלק התחתון הפך ורדרד אטום? אל תערבב עד שנוצר קו צבע ברור."
        time_estimate: "1 דקה"
      - step_number: 3
        action: "הפוך את השרימפס, הוסף 3 שיני שום פרוסות דק ו-30 גרם חמאה קרה."
        chef_guidance: "שמור על השום מלהישרף! הנמך להבה במידת הצורך ברגע שהשום משחרר את ריחו."
        time_estimate: "1 דקה"
      - step_number: 4
        action: "מזוג 2 כפות יין לבן, נער את המחבת ליצירת אמולסיה, הוסף פטרוזיליה קצוצה וכבה את האש מיד."
        chef_guidance: "הבט בצורת השרימפס: האם הם מכופפים כמו האות C? אם הם נסגרו לטבעת O הדוקה - הם עשויים מדי!"
        time_estimate: "45 שניות"

  - title: "אספרגוס חלוט וצרוב בחמאה חומה"
    ingredient_ref: "veg_asparagus_green"
    method_ref: "pan_sear"
    specific_steps:
      - step_number: 1
        action: "אחוז בשני קצוות האספרגוס וכופף עד לשבירה טבעית של החלק הסיבי התחתון; זרוק את הבסיס המעוצה."
        chef_guidance: "הגבעול יישבר בדיוק במקום שבו נגמר הסיב המעוצה ומתחיל החלק הפריך והבשרני."
        time_estimate: "2 דקות"
      - step_number: 2
        action: "חלוט את הגבעולים במים רותחים מומלחים במשך 90 שניות, והעבר מיד למי קרח לקירור מוחלט."
        chef_guidance: "האם האספרגוס עדיין יציב ואינו נובל? חליטת יתר תהרוס את הפריכות שלו."
        time_estimate: "2.5 דקות"
      - step_number: 3
        action: "המס חמאה במחבת עד שהקצף שוכך ומוצקי החלב מקבלים צבע אגוזי וניחוח קרמלי עמוק (Beurre Noisette)."
        chef_guidance: "שים לב לריח האגוזי המתוק. אל תתן לחמאה להשחיר - ברגע שהיא מזהיבה, הוסף את הירק."
        time_estimate: "2 דקות"
      - step_number: 4
        action: "גלגל את האספרגוס המיובש בתוך החמאה החומה למשך 60 שניות לספיגת טעמים והברקה מלאה."
        chef_guidance: "תבל במלח מאלדון וכמה טיפות מיץ לימון לסגירת השומניות. הגש מיד."
        time_estimate: "1 דקה"

  - title: "צ'יפס תפוחי אדמה בטיגון דו-שלבי מושלם"
    ingredient_ref: "veg_potato_russet"
    method_ref: "deep_fry"
    specific_steps:
      - step_number: 1
        action: "חתוך את תפוחי האדמה למקלות של 1 ס\"מ, ושטוף במים קרים זורמים עד שהמים צלולים לחלוטין מעמילן."
        chef_guidance: "שטיפת העמילן החיצוני מונעת מהצ'יפס להידבק ולהישרף לפני שהליבה מתרככת."
        time_estimate: "10 דקות"
      - step_number: 2
        action: "בצע בישול מקדים בשמן בחום נמוך (140°C-150°C) למשך 6-8 דקות עד לריכוך ללא השחמה כלל."
        chef_guidance: "הצ'יפס צריך להיראות חיוור אך להישבר בקלות בלחיצת אצבע. סנן וצנן לחלוטין על רשת 30 דקות."
        time_estimate: "8 דקות"
      - step_number: 3
        action: "העלה את חום השמן ל-190°C וטגן את הצ'יפס בשנית במנות קטנות למשך 2-3 דקות עד להזהבה וקריספיות."
        chef_guidance: "שמע את הצליל המתכתי והיבש כשהצ'יפס פוגש את הרשת? זהו סימן לקרום מיקרוסקופי יבש ומתפצח."
        time_estimate: "3 דקות"
      - step_number: 4
        action: "העבר מיד לרשת מוגבהת (לא נייר סופג!) והמלח במלח שולחן דק בעוד השמן רותח על המעטפת."
        chef_guidance: "מלח דק נדבק לשמן החם באופן אחיד; גרגרים גסים יישרו ויפלו לתחתית."
        time_estimate: "30 שניות"

  - title: "חזה אווז צרוב עם שומן פריך מקורמל"
    ingredient_ref: "duck_breast"
    method_ref: "pan_sear"
    specific_steps:
      - step_number: 1
        action: "חרוץ את שומן האווז בדוגמת שתי-וערב צפופה (מרווחים של 5 מ\"מ) מבלי לחתוך לתוך הבשר האדום."
        chef_guidance: "אם תפצע את הבשר, נוזלי הנתח יברחו החוצה והבשר יתייבש. חרוץ אך ורק את שכבת השומן הלבנה."
        time_estimate: "3 דקות"
      - step_number: 2
        action: "הנח את חזה האווז במחבת נירוסטה קרה לחלוטין ללא שמן, כשצד השומן כלפי מטה, והדלק אש בינונית-נמוכה."
        chef_guidance: "התחלה קרה מאפשרת לשומן להתנזל ולהינמס באטיות (Rendering) במקום להינעל ולהישרף."
        time_estimate: "8 דקות"
      - step_number: 3
        action: "שפוך את השומן הנוזלי המצטבר במחבת לצנצנת בצד במהלך הצריבה, עד שהעור נותר דק, שחום וסופר-פריך."
        chef_guidance: "האם העור קיבל גוון חום-ערמוני עמוק ומתפצח? זה הסימן שהשומן התת-עורי הומס כמעט במלואו."
        time_estimate: "4 דקות"
      - step_number: 4
        action: "הפוך את הנתח לצד הבשר וצרוב במשך 2-3 דקות בלבד עד להגעה ל-57°C פנימי (מדיום מדויק)."
        chef_guidance: "בשר אווז חייב להישאר ורוד ועסיסי! דרגת עשייה של וול-דאן תהפוך אותו לבעל טעם של כבד יבש."
        time_estimate: "3 דקות"
      - step_number: 5
        action: "העבר לקרש עץ ותן לו לנוח 8 דקות שלמות לפני פריסה לפרוסות אלכסוניות."
        chef_guidance: "האם הנחת לבשר להירגע? פריסה מוקדמת תרוקן את כל המיצים האדומים על הקרש."
        time_estimate: "8 דקות"