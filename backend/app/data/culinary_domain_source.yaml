# ==============================================================================
# CULINARY KNOWLEDGE BASE - SYSTEM ARCHITECTURE (FULL DOMAIN GRAPH)
# ==============================================================================

# ==============================================================================
# 1. CORE ARCHETYPES (מחלקות אב מופשטות להורשה היררכית)
# ==============================================================================
archetypes:
  # ----------------------------------------------------------------------------
  # בקר וטלה (Beef & Red Meat)
  # ----------------------------------------------------------------------------
  beef_tender_fast: &beef_tender_fast
    category: "בקר - נתחים רכים לצריבה מהירה"
    thermal_profile: "חום ישיר קיצוני, זמן קצר"
    target_doneness: "Rare עד Medium (50°C-56°C)"
    base_rules:
      - "הבאה קפדנית לטמפרטורת החדר (לפחות 20-30 דקות מראש)."
      - "ייבוש שטח פנים מוחלט לסיוע בתגובת מייאר מיידית."
      - "חובת מנוחה (Resting) על רשת מוגבהת לזמן השווה למחצית מזמן הצלייה."
    prep_notes: "הסרת קרומי כסף (Silver skin) ויישור שומן חיצוני לעובי אחיד."

  beef_tough_collagen: &beef_tough_collagen
    category: "בקר - נתחי קולגן לבישול ממושך"
    thermal_profile: "חום מתון ועקיף (130°C-150°C), לחות גבוהה"
    target_doneness: "פירוק קולגן מלא לג'לטין (92°C-96°C ליבה)"
    base_rules:
      - "צריבה ראשונית עמוקה ליצירת Fond עשיר בתחתית הסיר."
      - "שמירה על נוזלים במפלס של חצי עד שני-שליש מגובה הנתח (לא הצפה מלאה)."
      - "צינון חלקי של הנתח בתוך נוזלי הבישול לפני פריסה למניעת התפרקות."
    prep_notes: "קשירה אנטומית אם הנתח אינו אחיד; חריצת קרומים חיצוניים."

  beef_ground_emulsion: &beef_ground_emulsion
    category: "בקר - טחון ומעובד"
    thermal_profile: "חום ישיר בינוני-גבוה"
    target_doneness: "עסיסי (68°C-71°C ליבה)"
    base_rules:
      - "שמירה על קור קיצוני עד רגע המגע עם האש."
      - "איסור דחיסת-יתר לשמירה על חללי אוויר פנימיים ועסיסיות."
      - "המלחה ממש לפני הצריבה למניעת התפרקות חלבונים מוקדמת."
    prep_notes: "יחס שומן-בשר אופטימלי של 80/20; טחינה גסה עדיפה."

  # ----------------------------------------------------------------------------
  # עופות (Poultry)
  # ----------------------------------------------------------------------------
  poultry_lean_tender: &poultry_lean_tender
    category: "עופות - נתחים רזים ורגישים"
    thermal_profile: "חום מבוקר, מניעת ייבוש"
    target_doneness: "74°C ליבה מדויקת (פאסטוריזציה מלאה)"
    base_rules:
      - "ייבוש קפדני בנייר סופג לפני המפגש עם השומן."
      - "חיתוך בניצב מוחלט לכיוון הסיבים."
      - "מנוחה של 3-5 דקות לספיגה חוזרת של נוזלי התא."
    prep_notes: "השוואת עובי מכנית מתונה למניעת בישול לא אחיד."

  poultry_fatty_bone: &poultry_fatty_bone
    category: "עופות - נתחים שומניים עם עצם"
    thermal_profile: "חום ממושך, המסת שומן תת-עורי"
    target_doneness: "74°C-80°C ליבה"
    base_rules:
      - "צריבה ממושכת על צד העור להפקת שומן וקבלת פריכות."
      - "עמידות גבוהה לחום יבש ללא סכנת התייבשות מיידית."
    prep_notes: "הסרת שאריות נוצות וסחוסים משוחררים."

  poultry_waterfowl: &poultry_waterfowl
    category: "עופות מים - בשר אדום ושומן עבה"
    thermal_profile: "התכה איטית של שומן ואחריה צריבה מהירה של הבשר"
    target_doneness: "Medium-Rare עד Medium (57°C)"
    base_rules:
      - "חריצת שומן בצורת שתי-וערב ללא פציעת הבשר."
      - "התחלת בישול במחבת קרה לחלוטין (Cold pan start)."
    prep_notes: "סילוק מתמיד של השומן הנמס מהמחבת; מנוחה של 8 דקות."

  # ----------------------------------------------------------------------------
  # דגים ומאכלי ים (Fish & Seafood)
  # ----------------------------------------------------------------------------
  fish_delicate_white: &fish_delicate_white
    category: "דגים לבנים עדינים ורזים"
    thermal_profile: "חום בינוני-גבוה, טיפול עדין במיוחד"
    target_doneness: "עשייה רכה (50°C-54°C ליבה)"
    base_rules:
      - "מגע ותנועה מינימליים במחבת למניעת שבירת הנתח."
      - "המלחה מוקדמת מתונה (10-15 דקות לפני) למיצוק המבנה התאי."
      - "סיום בישול כאשר הדפים (Flakes) נפרדים בלחיצת אצבע קלה."
    prep_notes: "ייבוש קפדני של העור; בדיקת קוצים אלכסונית באצבעות."

  fish_fatty_steak: &fish_fatty_steak
    category: "דגי ים שמנים / נתחי סטייק"
    thermal_profile: "חום ישיר גבוה מאוד; עמידות יחסית לחום יבש"
    target_doneness: "Medium-Rare עד Medium (46°C-52°C)"
    base_rules:
      - "אינו דורש שומן רב במחבת – השומן הפנימי מוליך את החום ביעילות."
      - "צריבה על צד העור ברוב זמן הבישול לקבלת פריכות."
      - "פליטת משקעי חלבון לבנים (אלבומין) מעידה על חום מוגזם או בישול יתר."
    prep_notes: "חריצים אלכסוניים רדודים בעור בעובי 1 מ\"מ למניעת התעגלות."

  seafood_crustacean_fast: &seafood_crustacean_fast
    category: "פירות ים וסרטנאים - חלבון מתכווץ מהיר"
    thermal_profile: "חום קיצוני, שניות עד דקות ספורות"
    target_doneness: "60°C (גוון פנינה אטום, אלסטי)"
    base_rules:
      - "מעבר מצורת C לצורת O מעיד על בישול-יתר וצמיגיות."
      - "ייבוש שטח פנים מוחלט לסיוע בצריבה מהירה."
    prep_notes: "סילוק קפדני של מערכת העיכול (הפס השחור בגב)."

  # ----------------------------------------------------------------------------
  # ירקות (Vegetables)
  # ----------------------------------------------------------------------------
  leafy_green_tender: &leafy_green_tender
    category: "ירקות עליים עדינים"
    thermal_profile: "חום קצרצר או חום שיורי (Residual Heat)"
    base_rules:
      - "איבוד נפח קיצוני (מעל 80%) תוך 60 שניות."
      - "המלחה בסוף בלבד למניעת הפיכת העלה לסמרטוטי."
    prep_notes: "שטיפה בציפה במים קרים וייבוש בצנטריפוגה ייעודית."

  leafy_green_hardy: &leafy_green_hardy
    category: "ירקות עליים קשיחים וסיביים"
    thermal_profile: "חום בינוני רציף או ריכוך ממושך"
    base_rules:
      - "דורש שבירה מכנית מוקדמת (עיסוי) או בישול ארוך."
      - "שמירה על מבנה יציב ללא התפרקות מהירה."
    prep_notes: "הפשטה מלאה מהשדרה המעוצה המרכזית."

  cruciferous_firm: &cruciferous_firm
    category: "מצליבים דחוסים"
    thermal_profile: "חום גבוה יבש (צלייה/הקפצה) או חליטה קצרה"
    base_rules:
      - "ריכוך סיבים דורש חום ישיר חזק או חליטה מקדימה."
      - "הימנעות מבישול יתר המפתח ריחות גופרית."
    prep_notes: "חיתוך לתפרחות שוות גודל לחדירת חום סימטרית."

  root_tuber_starchy: &root_tuber_starchy
    category: "שורשים ופקעות עתירי עמילן"
    thermal_profile: "חום מבוקר הדרגתי (התחלה קרה במים) או צלייה עמוקה"
    base_rules:
      - "חובת בישול מלא לפירוק עמילנים בלתי מתעכלים."
      - "אידוי נוזלים יסודי לאחר בישול רטוב לקבלת פריכות."
    prep_notes: "החזקה במים קרים למניעת חמצון; ייבוש מוחלט לפני טיגון/צלייה."

  nightshade_watery: &nightshade_watery
    category: "סולניים עתירי נוזלים ומבנה ספוגי"
    thermal_profile: "חום גבוה לסילוק מים או ריכוך סוכרים ממושך"
    base_rules:
      - "דורש המלחה והגרת נוזלים למניעת ספיגת שומן פסיבית."
      - "בישול מלא עד ריכוך מוחלט (סולניים אינם טעימים כשהם חצי-חיים)."
    prep_notes: "בחירת ירקות מתוחים וקלי משקל יחסית לנפחם."

  # ----------------------------------------------------------------------------
  # קטניות ודגנים (Legumes & Grains)
  # ----------------------------------------------------------------------------
  legume_dry_dense: &legume_dry_dense
    category: "קטניות יבשות עתירות חלבון ועמילן"
    thermal_profile: "רתיחה עדינה ומבוקרת (Simmer) לאורך זמן"
    base_rules:
      - "השריה מוקדמת במים קרים פי 3 מנפח הקטנית (12-24 שעות)."
      - "הוספת מלח או חומצה אך ורק בחצי השני של הבישול."
      - "קיפוי קפדני של קצף החלבונים שעולה בדקות הרתיחה הראשונות."
    prep_notes: "ברירה פיזית יבשה על מגש נקי ושטיפה במסננת צפופה."

  grain_starch_releasing: &grain_starch_releasing
    category: "דגנים פולטי עמילן לבישול תחליבי"
    thermal_profile: "חום בינוני רציף תוך שחיקה מכנית (ערבוב מתמיד)"
    base_rules:
      - "איסור שטיפה במים לפני הבישול (שימור שכבת האמילוז החיצונית)."
      - "קליה יבשה בשומן לוהט לפני הוספת נוזלים."
      - "הזנת ציר רותח בהדרגה ליצירת תחליב שומן-עמילן יציב (Mantecatura)."
    prep_notes: "הכנת ציר מקביל רותח במחבת סמוכה לאורך כל זמן התהליך."

# ==============================================================================
# 2. BASE INGREDIENTS (חומרי גלם עם ירושה מוחלטת)
# ==============================================================================
base_ingredients:
  # בקר וטלה
  beef_ribeye:
    <<: *beef_tender_fast
    name: "אנטרקוט (Ribeye)"
    prep_notes: "השארת שומן תוך-שרירי שלם; חיתוך לפחות בעובי 3.5 ס\"מ."

  beef_tenderloin:
    <<: *beef_tender_fast
    name: "פילה בקר (Tenderloin)"
    prep_notes: "הסרת גיד הכסף; קשירת הנתח לעובי גלילי אחיד."

  beef_sirloin:
    <<: *beef_tender_fast
    name: "סינטה (Striploin)"
    prep_notes: "חריצת פס השומן החיצוני כל 2 ס\"מ למניעת התעוותות בחום."

  beef_short_ribs:
    <<: *beef_tough_collagen
    name: "אסאדו (Short Ribs / שפונדרה)"
    prep_notes: "הסרת הממברנה הלבנה מהצד הפנימי של העצמות."

  beef_ground:
    <<: *beef_ground_emulsion
    name: "בקר טחון"
    prep_notes: "שמירה על קור של 2°C-4°C עד להנחה על המשטח הלוהט."

  # עופות
  chicken_breast:
    <<: *poultry_lean_tender
    name: "חזה עוף"
    prep_notes: "שיטוח מכני עדין לעובי אחיד של 1.5-2 ס\"מ."

  chicken_thighs_boneless:
    <<: *poultry_fatty_bone
    name: "פרגית (ירך ללא עצם)"
    target_doneness: "74°C ליבה"
    prep_notes: "יישור הנתח, חיתוך גידים קשים פנימיים."

  turkey_thigh:
    <<: *poultry_fatty_bone
    name: "שווארמה הודו (ירך הודו נקבה)"
    prep_notes: "הסרת גידים עבים; חיתוך לרצועות דקות בניצב לסיב."

  duck_breast:
    <<: *poultry_waterfowl
    name: "חזה אווז (מגרט)"
    prep_notes: "חריצת שומן שתי-וערב במרווחי 5 מ\"מ מבלי לחתוך בבשר."

  # דגים ומאכלי ים
  fish_salmon_fillet:
    <<: *fish_fatty_steak
    name: "פילה סלמון"
    target_doneness: "50°C ליבה (ורוד רך ועסיסי)"
    prep_notes: "שליפת עצמות רוחביות עם פינצטה; ייבוש קפדני של העור."

  fish_tuna_loin:
    <<: *fish_fatty_steak
    name: "טונה אדומה (נתח לוין)"
    target_doneness: "Rare מובהק (40°C-42°C ליבה)"
    prep_notes: "חיתוך בסכין שף חדה בלבד ללא מחיצת הבשר."

  fish_sea_bream_fillet:
    <<: *fish_delicate_white
    name: "פילה דניס"
    prep_notes: "הסרת קשקשים שולית; חריצים מיקרוסקופיים בעור."

  fish_sea_bass:
    <<: *fish_delicate_white
    name: "לברק (פילה או שלם)"
    prep_notes: "ייבוש פנים וחוץ; חריצה אלכסונית עד השדרה אם שלם."

  seafood_shrimp:
    <<: *seafood_crustacean_fast
    name: "שרימפס / קריסטל"
    prep_notes: "קילוף, שמירת זנב, חריצה לאורך הגב ושליפת הווריד השחור."

  # ירקות
  veg_eggplant:
    <<: *nightshade_watery
    name: "חציל בלאדי"
    prep_notes: "חירור הקליפה במזלג למניעת לחץ אדים פנימי מתפרץ."

  veg_cauliflower:
    <<: *cruciferous_firm
    name: "כרובית"
    prep_notes: "קטימת בסיס הגבעול; חליטה מקדימה לריכוך הליבה."

  veg_broccoli:
    <<: *cruciferous_firm
    name: "ברוקולי"
    prep_notes: "פירוק לתפרחות; קילוף גבעולים מסיבים קשים."

  veg_sweet_potato:
    <<: *root_tuber_starchy
    name: "בטטה"
    prep_notes: "שטיפה, ניגוב, חירור בסכין במספר מקומות."

  veg_potato_russet:
    <<: *root_tuber_starchy
    name: "תפוח אדמה עתיר עמילן"
    prep_notes: "חיתוך שווה; שטיפת עמילן חופשי במים קרים זורמים."

  veg_asparagus_green:
    <<: *cruciferous_firm
    name: "אספרגוס ירוק"
    prep_notes: "שבירה מכנית טבעית של הבסיס המעוצה ביד."

  veg_spinach:
    <<: *leafy_green_tender
    name: "תרד"
    prep_notes: "שטיפת חול כפולה; סחיטה מוחלטת של עודפי מים."

  # דגנים וקטניות
  grain_rice_arborio:
    <<: *grain_starch_releasing
    name: "אורז ארבוריו / קרנרולי"
    prep_notes: "ללא שטיפה; הכנת ציר רותח במקביל."

  legume_chickpea:
    <<: *legume_dry_dense
    name: "גרגירי חומוס יבשים"
    prep_notes: "השריה 18 שעות במים קרים עם מעט סודה לשתייה."

# ==============================================================================
# 3. COOKING METHODS (שיטות בישול עם כללי אזהרה מוקדמת)
# ==============================================================================
cooking_methods:
  pan_sear:
    name: "צריבה במחבת (Pan Sear)"
    description: "הולכת חום ישירה ומהירה ממשטח מתכת עתיר אגירה תרמית ליצירת תגובת מייאר."
    default_instructions:
      - "חמם מחבת ברזל יצוק או נירוסטה לחום גבוה עם שכבת שומן דקה."
      - "הנח את הנתח בתנועה המתרחקת מגופך למניעת נתזי שמן."
      - "הימנע מהזזת הנתח עד לשחרור עצמי מלא מתחתית המתכת."

  grill_direct:
    name: "צלייה בגריל ישיר (Direct Grilling)"
    description: "קרינת חום אדירה מגחלים או מבערי גז ישירים לפיתוח טעמי עישון וחריכה."
    default_instructions:
      - "חמם ושמן את רשת הגריל כשהיא לוהטת."
      - "סדר שני אזורי חום: מוקד ישיר חזק ואזור מיתון עקיף."

  oven_roast:
    name: "צלייה בתנור (Oven Roast)"
    description: "בישול בחום יבש של הסעת אוויר היקפית."
    default_instructions:
      - "חמם תנור 20 דקות מראש להשגת יציבות תרמית מלאה."
      - "השתמש ברשת מוגבהת לזרימת אוויר תחת הנתח."

  braise:
    name: "בישול ארוך בקדירה (Braise)"
    description: "צריבה יבשה עמוקה ולאחריה בישול איטי בנוזל חלקי בכלי סגור ואטום."
    default_instructions:
      - "צרוב את הנתח עמוקות מכל עבריו."
      - "בצע דגלאז' עם נוזל חומצי להמסת משקעי ה-Fond."
      - "בשל בבעבוע עדין בלבד בכלי אטום לחלוטין."

  stir_fry:
    name: "הקפצה בווק (Stir Fry)"
    description: "בישול בחום קיצוני תוך כדי תנועה מתמדת של חומרי גלם אחידים."
    default_instructions:
      - "חמם ווק עד לסף העלאת עשן."
      - "הקפץ בסדר קפדני: חלבון, ירקות קשים, ירקות רכים, רוטב."

  raw_cure:
    name: "נא / כבישה קרה (Raw / Curing)"
    description: "עיבוד קר ללא חום תרמי באמצעות חיתוך מדויק וחומציות מבוקרת."
    default_instructions:
      - "שמור על טמפרטורה מתחת ל-4°C לכל אורך התהליך."
      - "חתוך במשיכה חלקה אחת בסכין חדה."

  steam:
    name: "אידוי (Steaming)"
    description: "בישול עדין באדי מים מוליכי חום ללא מגע ישיר עם הנוזל."
    default_instructions:
      - "וודא רתיחה סוערת והפקת אדים מלאה לפני הכנסת הירק/דג."
      - "שמור על מכסה אטום."

  sous_vide:
    name: "סו-וויד (Sous-vide)"
    description: "בישול באמבט מים בטמפרטורה מדויקת בוואקום מוחלט."
    default_instructions:
      - "וודא שאיבת אוויר מלאה מהשקית."
      - "יבש לחלוטין לפני צריבת סיום מהירה."

  deep_fry:
    name: "טיגון עמוק (Deep Fry)"
    description: "שיקוע מלא בשמן חם ומדוד ליצירת קרום פריך ואטימת עסיסיות."
    default_instructions:
      - "מדוד טמפרטורת שמן במדחום ייעודי."
      - "סנן לרשת מוגבהת והמלח מיד בעוד השמן לוהט."

  boil_simmer:
    name: "בישול במים / בישול עדין (Boil / Simmer)"
    description: "בישול בנוזל שופע ברתיחה מתונה ומבוקרת."
    default_instructions:
      - "התחל במים קרים לפקעות וקטניות; מים רותחים לפסטה וירק ירוק."
      - "שמור על קצב בעבוע יציב."

# ==============================================================================
# 4. RECIPE PATHS - 20 תהליכים מורחבים הכוללים הנחיות עוקבות (LOOK-AHEAD)
# ==============================================================================
recipe_paths:

  # 1. חזה עוף
  - title: "חזה עוף צרוב במחבת עם חמאת טימין"
    archetype_ref: "poultry_lean_tender"
    ingredient_ref: "chicken_breast"
    method_ref: "pan_sear"
    steps:
      - step_number: 1
        action: "ייבש את חזה העוף היטב בנייר סופג, המלח במלח דק מכל צד, וחמם מחבת נירוסטה עם כף שמן לחום בינוני-גבוה."
        sensory_checkpoint: "השמן נוזלי ומבריק כמים, עם גלים זעירים אך ללא עשן סמיך."
        early_warning: "אם השמן מעשן בכבדות, הזז את המחבת מהלהבה ל-20 שניות. שמן שרוף יכתים את העוף במרירות."
        next_step_prep: "הכן את מלקחי הברזל ביד; אל תתרחק מהכיריים."
        time_estimate: "3 דקות"
      - step_number: 2
        action: "הנח את חזה העוף בתנועה המתרחקת ממך, ולחץ עליו בעדינות עם המלקחיים למשך 5 שניות למגע מלא."
        sensory_checkpoint: "רחישה חזקה, אחידה ורציפה מרגע המגע הראשוני."
        early_warning: "אל תזיז את הנתח ואל תנסה להפוך אותו! החלבון יידבק וייקרע אם תפעיל כוח לפני יצירת הקרום."
        next_step_prep: "מדוד 20 גרם חמאה קרה ושן שום מעוכה והנח ליד הכיריים."
        time_estimate: "3 דקות"
      - step_number: 3
        action: "הפוך את הנתח, הוסף את החמאה, השום והטימין, הטה את המחבת והשקה את העוף בכף (Basting) ברציפות."
        sensory_checkpoint: "החמאה מקציפה בגוון אגוזי זהוב עם ניחוח עשבי עז."
        early_warning: "אם מוצקי החלב משחירים, הנמך מיד את הלהבה לנמוכה ביותר."
        next_step_prep: "הכן צלחת עץ או רשת מנוחה ומדחום נעץ דיגיטלי."
        time_estimate: "2.5 דקות"
      - step_number: 4
        action: "נעץ מדחום במרכז הנתח (יעד: 73°C), הוצא מיד לרשת מנוחה והשאר ללא כיסוי."
        sensory_checkpoint: "בשר קפיצי ומוצק למגע עדין, ללא פליטת נוזלים דמיים."
        early_warning: "אל תפרוס כעת! פריסה מוקדמת תרוקן את כל הלחות הפנימית אל משטח העץ."
        next_step_prep: "הכן סכין שף חדה וקרש יציב לפריסה באלכסון בעוד 4 דקות."
        time_estimate: "4 דקות"

  # 2. סטייק אנטרקוט
  - title: "סטייק אנטרקוט בגריל ישיר"
    archetype_ref: "beef_tender_fast"
    ingredient_ref: "beef_ribeye"
    method_ref: "grill_direct"
    steps:
      - step_number: 1
        action: "משח את הסטייק (בטמפרטורת חדר) במעט שמן ניטרלי ופזר מלח ים אטלנטי גס בשכבה אחידה."
        sensory_checkpoint: "גרגירי המלח נצמדים לשכבת השמן הדקה; הבשר אינו מזיע מים קרים."
        early_warning: "אם הנתח יצא הרגע מהמקרר, עצור והמתן. צליית בשר קר תוביל למרכז קפוא ומעטפת שרופה."
        next_step_prep: "נקה את רשת הגריל במברשת ברזל ושמן אותה קלות במגבת נייר טבולה בשמן."
        time_estimate: "5 דקות"
      - step_number: 2
        action: "הנח את הסטייק באזור החום הישיר של הגריל בזווית של 45 מעלות לקווי הרשת."
        sensory_checkpoint: "רעש צריבה עוצמתי ועשן שומן ארומטי עולה מהגחלים."
        early_warning: "אם להבה גבוהה אוחזת בבשר עקב טפטוף שומן, הזז אותו 5 ס\"מ הצידה למניעת טעם פיח מר."
        next_step_prep: "הכן טיימר ל-2 דקות בדיוק לצורך סיבוב הנתח."
        time_estimate: "2 דקות"
      - step_number: 3
        action: "סובב את הסטייק ב-90 מעלות על אותו הצד כדי לייצר דוגמת שתי-וערב (Diamond Marks)."
        sensory_checkpoint: "פסי צריבה שחומים ועמוקים נמתחים על פני השטח ללא חריכה מפוחמת."
        early_warning: "אל תהפוך עדיין לצד השני – תן לחום לבנות את הקרום התחתון."
        next_step_prep: "וודא שאזור החום העקיף בגריל פנוי לקליטת הנתח."
        time_estimate: "2 דקות"
      - step_number: 4
        action: "הפוך לצד השני, צרוב 2 דקות, והעבר לאזור החום העקיף עד להגעה ל-53°C בליבה (מדיום-רר)."
        sensory_checkpoint: "המדחום מציג 53°C; הנתח מתנגד קלות בלחיצה בדומה לכרית כף היד."
        early_warning: "אל תעבור את ה-55°C בגריל – הבשר ימשיך להתבשל בעצמו בעלייה של עוד 2-3 מעלות."
        next_step_prep: "הכן קרש עץ נקי ומלקחיים למעבר למנוחה של 6 דקות."
        time_estimate: "4 דקות"

  # 3. פילה סלמון
  - title: "פילה סלמון צרוב בעור פריך"
    archetype_ref: "fish_fatty_steak"
    ingredient_ref: "fish_salmon_fillet"
    method_ref: "pan_sear"
    steps:
      - step_number: 1
        action: "גרד את עור הסלמון עם גב סכין להסרת עודפי לחות, נגב היטב, והמלח את צד העור במלח דק."
        sensory_checkpoint: "העור נראה מט לחלוטין ויבש כנייר קלף."
        early_warning: "עור לח יידבק למחבת וייקרע. יובש הוא התנאי היחיד לפריכות."
        next_step_prep: "חמם מחבת נירוסטה עם כף שמן זית לחום בינוני; החזק מרית דגים גמישה."
        time_estimate: "2 דקות"
      - step_number: 2
        action: "הנח את הפילה על צד העור ולחץ ברציפות בעזרת המרית על כל שטח הנתח למשך 20 שניות."
        sensory_checkpoint: "הנתח נשאר ישר לחלוטין ואינו מתעגל כלפי מעלה."
        early_warning: "שחרור מוקדם של הלחץ יגרום לעור להתכווץ ולמרכז הנתח להתרומם מקרקעית המחבת."
        next_step_prep: "הבט בצד הפילה – עקוב אחר קו שינוי הצבע שעולה לאיטו."
        time_estimate: "1 דקה"
      - step_number: 3
        action: "הנמך מעט את הלהבה והמשך לצרוב על צד העור עד ש-80% מעובי הפילה הופך לוורוד אטום."
        sensory_checkpoint: "העור מתקשה והופך לפריך לחלוטין; בועות שומן קטנות רוחשות סביבו."
        early_warning: "אם משקע לבן (אלבומין) מתפרץ החוצה מהשריר, החום גבוה מדי – הנמך להבה מיד."
        next_step_prep: "הכן צלחת הגשה חמה וסכין לפריסה או מרית שטוחה."
        time_estimate: "4 דקות"
      - step_number: 4
        action: "הפוך את הדג לצד הבשר ל-30 שניות בלבד, כבה את האש והעבר לצלחת כשצד העור פונה מעלה."
        sensory_checkpoint: "מרכז הפילה רך, מבריק וחמים (כ-48°C-50°C)."
        early_warning: "לעולם אל תניח את הפילה בצלחת כשצד העור כלפי מטה – האדים ירככו את הפריכות מיד."
        next_step_prep: "תבל בכמה טיפות מיץ לימון סחוט טרי מעל צד הבשר בלבד."
        time_estimate: "45 שניות"

  # 4. אסאדו בקר
  - title: "אסאדו בקר בבישול ארוך בקדירה"
    archetype_ref: "beef_tough_collagen"
    ingredient_ref: "beef_short_ribs"
    method_ref: "braise"
    steps:
      - step_number: 1
        action: "חמם סיר יצוק כבד עם 2 כפות שמן, וצרוב את נתחי האסאדו מכל עבריהם עד להשחמה עמוקה."
        sensory_checkpoint: "קרום חום-מהגוני כהה ועשיר עוטף את כל פאות הבשר."
        early_warning: "אל תעמיס את הסיר בבת אחת. צפיפות תוביל להפרשת נוזלים ובישול באדים במקום השחמה."
        next_step_prep: "קצוץ גס בצל, גזר וסלרי לקראת הזריקה לסיר."
        time_estimate: "12 דקות"
      - step_number: 2
        action: "הוצא את הנתחים לצלחת, הוסף את הירקות לסיר והזע אותם תוך גירוד התחתית בכף עץ."
        sensory_checkpoint: "משקעי הבשר החומים שבתחתית (Fond) מתחילים להתרכך ולהיצבע בירקות."
        early_warning: "אם התחתית משחירה לחלוטין במקום להשחים, הנמך חום כדי למנוע מרירות ברוטב."
        next_step_prep: "מדוד כוס יין אדום יבש וציר בקר חם."
        time_estimate: "6 דקות"
      - step_number: 3
        action: "מזוג את היין האדום פנימה, גרד במרץ את המשקעים וצמצם את הנוזל ב-50% ברתיחה עזה."
        sensory_checkpoint: "האדים מאבדים את החריפות האלכוהולית ומקבלים ריח ענבים מרוכז ומתקתק."
        early_warning: "אל תוסיף את הציר לפני שהיין הצטמצם – האלכוהול חייב להתנדף תחילה."
        next_step_prep: "החזר את נתחי הבשר וסדר אותם בצפיפות כשהעצם כלפי מטה."
        time_estimate: "4 דקות"
      - step_number: 4
        action: "מזוג ציר בקר עד 2/3 מגובה הנתחים, הבא לרתיחה, כסה הרמטית והעבר לתנור שחומם ל-140°C."
        sensory_checkpoint: "בעבוע עדין מאוד בשולי הסיר; המכסה חם ואטום היטב."
        early_warning: "אם התנור חם מדי והנוזל רותח בעוצמה, הבשר יתייבש ויהפוך סיבי למרות הרוטב."
        next_step_prep: "הכן טיימר ל-3 שעות; בדוק מפלס נוזלים לאחר שעתיים."
        time_estimate: "3 שעות"
      - step_number: 5
        action: "בדוק רכות בעזרת נעיצת מזלג (Fork-tender); כבה את התנור והשאר את הבשר לנוח בנוזל 30 דקות."
        sensory_checkpoint: "המזלג ננעץ ומסתובב בתוך הבשר ללא כל התנגדות; העצם כמעט נשלפת מעצמה."
        early_warning: "אל תוציא את הבשר מהנוזל לאוויר הפתוח מיד – הסיבים יתייבשו במגע ישיר עם האוויר."
        next_step_prep: "הכן כף מחוררת רחבה לחילוץ עדין של הנתחים השלמים."
        time_estimate: "30 דקות"

  # 5. רוסטביף סינטה
  - title: "רוסטביף סינטה בתנור בשיטת הצלייה המתונה"
    archetype_ref: "beef_tender_fast"
    ingredient_ref: "beef_sirloin"
    method_ref: "oven_roast"
    steps:
      - step_number: 1
        action: "קשור את הנתח בחוט קצבים במרווחים של 2 ס\"מ, מרח בשמן זית, חרדל דיז'ון, פלפל גרוס ומלח גס."
        sensory_checkpoint: "גליל בשר הדוק, סימטרי ומצופה במעטפת אחידה."
        early_warning: "אי-קשירה של הנתח תוביל לצורת חרוט שבה החלק הדק מתייבש כליל בזמן שהחלק העבה עוד נא."
        next_step_prep: "חמם מחבת כבדה לחום גבוה וכוון את התנור ל-120°C בלבד."
        time_estimate: "5 דקות"
      - step_number: 2
        action: "צרוב את הנתח במחבת מכל צדדיו, תוך דגש על העמדת פס השומן לצריבה ישירה של 2 דקות."
        sensory_checkpoint: "פס השומן הופך מלבן ונוקשה לזהוב, רך וצרוב היטב."
        early_warning: "אל תשרוף את התבלינים והחרדל – שמור על צריבה מדויקת ללא עשן חרוך."
        next_step_prep: "מקם רשת צלייה מוגבהת בתוך תבנית תנור מרופדת בנייר כסף."
        time_estimate: "6 דקות"
      - step_number: 3
        action: "העבר את הנתח על הרשת למרכז התנור (120°C) ובשל עד להגעה ל-52°C במדחום הליבה."
        sensory_checkpoint: "שחרור ריח צלי מתון ללא טיגון שומן רועש; שטח פנים יבש ושחום."
        early_warning: "אל תפתח את דלת התנור תכופות – שינויי טמפרטורה פוגעים בצלייה המתונה."
        next_step_prep: "הכן משטח מנוחה ונייר כסף רופף."
        time_estimate: "45 דקות"
      - step_number: 4
        action: "הוצא את הנתח, כסה ברפיון בנייר כסף והנח לו לשהות 15 דקות שלמות לפני חיתוך."
        sensory_checkpoint: "הטמפרטורה הפנימית ממשיכה לטפס מעצמה ל-55°C (Medium-Rare מושלם)."
        early_warning: "פריסה לפני תום 15 הדקות תגרום לאובדן של עד 20% מנוזלי הנתח על הקרש."
        next_step_prep: "השחז סכין פריסה ארוכה וחלקה (Carving knife) לחיתוך דק כנייר."
        time_estimate: "15 דקות"

  # 6. פרגיות מוקפצות בווק
  - title: "פרגיות מוקפצות בווק עם ירקות ברוטב סויה-שום"
    archetype_ref: "poultry_fatty_bone"
    ingredient_ref: "chicken_thighs_boneless"
    method_ref: "stir_fry"
    steps:
      - step_number: 1
        action: "חתוך את הפרגית לרצועות של 1 ס\"מ, ערבב עם כפית קורנפלור וכף סויה, וחמם ווק לחום קיצוני."
        sensory_checkpoint: "הווק מתחיל להעלות נימות עשן דקות מכל היקפו."
        early_warning: "אם הווק אינו חם דיו, הבשר יפריש מים ויתבשל בנוזליו במקום להיצרב מיידית."
        next_step_prep: "סדר את קעריות הירקות הפרוסים, השום הכתוש והרוטב במרחק הושטת יד."
        time_estimate: "5 דקות"
      - step_number: 2
        action: "מזוג 2 כפות שמן על דפנות הווק, השלך את הפרגיות ופרוס אותן בשכבה אחת ל-60 שניות ללא נגיעה."
        sensory_checkpoint: "רעש רחישה מחריש אוזניים וריח צריבה אסייתי (Wok Hei)."
        early_warning: "אל תערבב ברגע הראשון – תן לחום לתפוס את הבשר ולקבע את הציפוי."
        next_step_prep: "הכן כף ערבוב רחבה או מרית ווק ייעודית."
        time_estimate: "1.5 דקות"
      - step_number: 3
        action: "הקפץ את העוף עוד 60 שניות עד להזהבה מלאה והוצא מיד לקערה בצד."
        sensory_checkpoint: "נתחי הפרגית שחומים בקצוות ומבריקים, אך עדיין עסיסיים."
        early_warning: "אל תשאיר את העוף בווק בזמן הקפצת הירקות – הוא יתייבש ויהפוך צמיגי."
        next_step_prep: "השלך מיד את הבצל והזוקיני הפרוסים לתוך הווק הריק והלוהט."
        time_estimate: "1 דקה"
      - step_number: 4
        action: "הקפץ את הירקות 90 שניות, החזר את העוף, מזוג את הרוטב על הדפנות והקפץ 30 שניות לאיחוד."
        sensory_checkpoint: "הרוטב מבעבע ומתקרמל ברגע המגע בדפנות ומצפה את המרכיבים בזיגוג כהה ומבריק."
        early_warning: "אל תמזוג את הרוטב למרכז הווק – מזיגה על הדופן היא שמעניקה את טעם הקרמליזציה."
        next_step_prep: "העבר מיד לצלחות הגשה עמוקות."
        time_estimate: "2 דקות"

  # 7. טרטר טונה אדומה
  - title: "טרטר טונה אדומה קלאסי עם שאלוט ועירית"
    archetype_ref: "fish_fatty_steak"
    ingredient_ref: "fish_tuna_loin"
    method_ref: "raw_cure"
    steps:
      - step_number: 1
        action: "קרר את נתח הטונה במקפיא למשך 10 דקות להתמצקות, וחתוך לקוביות זעירות ומדויקות של 4-5 מ\"מ."
        sensory_checkpoint: "הקוביות בעלות זוויות חדות ומוגדרות, ללא מעיכה או מריחה של הבשר."
        early_warning: "סכין קהה תלחץ על הדג ותסחט את נוזליו. השתמש בלהב מושחזת כאיזמל בלבד."
        next_step_prep: "הנח קערת נירוסטה קטנה מעל קערה גדולה יותר המלאה בקוביות קרח ומים."
        time_estimate: "6 דקות"
      - step_number: 2
        action: "העבר את קוביות הטונה לקערה המקוררת, והוסף שאלוט קצוץ דק ביותר, עירית קצוצה ושמן זית איכותי."
        sensory_checkpoint: "שמן הזית עוטף כל קובייה בברק מזהיר; הקערה קרה לחלוטין למגע."
        early_warning: "אל תוסיף עדיין מלח או מיץ לימון בשום פנים ואופן."
        next_step_prep: "הכן את המלח האטלנטי, גרידת הלימון ומיץ הלימון הסחוט הטרי."
        time_estimate: "2 דקות"
      - step_number: 3
        action: "ממש ברגע ההגשה, הוסף מלח מאלדון, כפית מיץ לימון וגרידת לימון, וערבב בתנועת קיפול בודדת."
        sensory_checkpoint: "צבע הדג נשאר אדום-אודם זוהר ועמוק."
        early_warning: "חומצת הלימון תבשל את הדג (דנטורציה) ותהפוך את צבעו לאפור עמום תוך 5 דקות. הגש מיד!"
        next_step_prep: "העבר לרינג נירוסטה על צלחת הגשה מקוררת וחלץ בעדינות."
        time_estimate: "30 שניות"

  # 8. כרובית שלמה צלויה
  - title: "כרובית שלמה צלויה בתנור בציפוי חמאה שחומה"
    archetype_ref: "cruciferous_firm"
    ingredient_ref: "veg_cauliflower"
    method_ref: "oven_roast"
    steps:
      - step_number: 1
        action: "ישר את בסיס הגבעול של הכרובית וחלוט אותה בסיר מים מומלחים רותחים במשך 7 דקות."
        sensory_checkpoint: "סכין ננעצת בבסיס בהתנגדות קלה; התפרחות יציבות ואינן מתפרקות."
        early_warning: "אל תדלג על החליטה – כרובית גולמית הנכנסת ישירות לתנור תישרף בחוץ לפני שמרכזה יתרכך."
        next_step_prep: "הכן מסננת גדולה ותבנית מרופדת בנייר אפייה; חמם תנור ל-200°C."
        time_estimate: "10 דקות"
      - step_number: 2
        action: "הוצא את הכרובית, הנח אותה במסננת 5 דקות לאידוי מוחלט, והברש בשמן זית, חמאה מומסת ומלח גס."
        sensory_checkpoint: "הכרובית יבשה למגע מאדים; שכבת השומן נצמדת ומכסה את כל התפרחות."
        early_warning: "הברשת כרובית רטובה תגרום לשמן להחליק ממנה ולמנוע השחמה."
        next_step_prep: "הנח את הכרובית במרכז התבנית והכנס לתנור."
        time_estimate: "5 דקות"
      - step_number: 3
        action: "צלה בתנור ב-200°C במשך 35-40 דקות עד לקבלת מעטפת חרוכה ועמוקה וגוון אגוזי."
        sensory_checkpoint: "התפרחות החיצוניות מושחמות מאוד, עם קצוות פריכים וריח קלוי עמוק."
        early_warning: "אם הכרובית מתחילה להשחיר יתר על המידה אחרי 20 דקות, כסה את החלק העליון ברפיון בנייר כסף."
        next_step_prep: "בדוק רכות עם קיסם או סכין קטנה בליבה."
        time_estimate: "35 דקות"
      - step_number: 4
        action: "חלץ מהתנור, פזר גרידת לימון ומלח מאלדון מעל, והגש שלמה לשולחן."
        sensory_checkpoint: "הסכין חותכת את הכרובית כמחמאה רכה ללא התנגדות."
        early_warning: "אין לחתוך מראש – הגשה שלמה שומרת על חום פנימי ולחות מרבית."
        next_step_prep: "הגש לצד טחינה חמצמצה או יוגורט קר."
        time_estimate: "1 דקה"

  # 9. חציל שרוף
  - title: "חציל בלאדי שרוף באש גלויה"
    archetype_ref: "nightshade_watery"
    ingredient_ref: "veg_eggplant"
    method_ref: "grill_direct"
    steps:
      - step_number: 1
        action: "חורר את קליפת החציל ב-4 מוקדים בעזרת מזלג והנח אותו ישירות מעל להבת גז גלויה או גחלים לוחשות."
        sensory_checkpoint: "להבת האש נוגעת ישירות בקליפה; רחש פצפוץ עדין מתחיל מיד."
        early_warning: "חובת חירור! חציל שאינו מחורר יפתח לחץ קיטור פנימי ויתפוצץ ברעש ובסכנת כוויה."
        next_step_prep: "הכן מלקחיים ארוכות ממתכת ומסננת רחבה בכיור."
        time_estimate: "1 דקה"
      - step_number: 2
        action: "צלה את החציל במשך 15-18 דקות תוך סיבוב רבע סיבוב בכל 4 דקות."
        sensory_checkpoint: "הקליפה מפוחמת לחלוטין, שבירה ומתפצחת; גוף החציל מתכווץ ומתרכך."
        early_warning: "אל תפחד מקליפה שחורה ושרופה – זהו מקור הארומה המעושנת הנדרשת."
        next_step_prep: "וודא שהמסננת בכיור נקייה ומוכנה לקליטת החציל המהביל."
        time_estimate: "18 דקות"
      - step_number: 3
        action: "הורד את החציל כשהוא קורס תחת כובד משקלו, פתח חריץ אורכי והנח במסננת לניקוז נוזלים."
        sensory_checkpoint: "נוזל שחור וכהה ניגר החוצה אל הכיור; נפח החציל יורד במתינות."
        early_warning: "אי-ניקוז הנוזלים המרים יהפוך את סלט החצילים לחומצי, מיימי ולא נעים."
        next_step_prep: "הכן כף עץ גדולה לקילוף הבשר מתוך הקליפה."
        time_estimate: "15 דקות"
      - step_number: 4
        action: "גרד את בשר החציל הלבן מהקליפה המפוחמת בעזרת הכף והעבר לקרש עץ."
        sensory_checkpoint: "בשר חציל בהיר, מעושן ורך כמשי, עם פתיתי עשן בודדים."
        early_warning: "בשום אופן אל תשטוף את החציל במים! שטיפה תמחק ברגע את כל טעמי האש והגחלים."
        next_step_prep: "קצוץ גס בסכין ותבל בשמן זית, שום כתוש, מלח ולימון."
        time_estimate: "3 דקות"

  # 10. פילה דניס מאודה
  - title: "פילה דניס מאודה ברוטב סויה, ג'ינג'ר ובצל ירוק"
    archetype_ref: "fish_delicate_white"
    ingredient_ref: "fish_sea_bream_fillet"
    method_ref: "steam"
    steps:
      - step_number: 1
        action: "הנח את פילה הדניס על צלחת חסינת חום המרופדת בפרוסות ג'ינג'ר וענפי בצל ירוק."
        sensory_checkpoint: "הפילה מונח על מצע הירק ואינו נוגע ישירות בקרקעית הצלחת."
        early_warning: "מגע ישיר עם הצלחת עלול לגרום להידבקות ובישול לא אחיד של הדג מנוזלי הצלחת."
        next_step_prep: "וודא שסיר האידוי רותח בעוצמה ומייצר אדים סמיכים."
        time_estimate: "2 דקות"
      - step_number: 2
        action: "הכנס את הצלחת לסלסילת האידוי, סגור היטב במכסה ובשל באדים במשך 6-7 דקות."
        sensory_checkpoint: "אדים דחוסים פורצים מחרכי המכסה; אין שקיעה בעוצמת הרתיחה."
        early_warning: "אל תפתח את המכסה באמצע התהליך – בריחת אדים תוריד את החום ותאריך את זמן הבישול."
        next_step_prep: "חתוך בצל ירוק וג'ינג'ר לשערות דקיקות (Julienne); חמם שמן שומשום במחבת קטנה."
        time_estimate: "6 דקות"
      - step_number: 3
        action: "פתח את המכסה ובדוק בעזרת מזלג: בשר הדג צריך להיות לבן ואטום ולהיפרד בקלות לדפים."
        sensory_checkpoint: "פילה אטום ולח עם מרכז מוצק אך רך; אין שקיפות גולמית בשדרה."
        early_warning: "אם הדג מתחיל להתפורר מעצמו, הוא עבר אידוי-יתר. חלץ אותו מיד."
        next_step_prep: "ערום את שערות הבצל והג'ינג'ר ישירות על הדג המאודה."
        time_estimate: "1 דקה"
      - step_number: 4
        action: "מזוג שמן שומשום לוהט על ערימת הבצל והג'ינג'ר וסיים ברוטב סויה בהיר סביב הדג."
        sensory_checkpoint: "צליל תסיסה רוחשת מיידית של השמן על העשבים הטריים וריח שומשום עז."
        early_warning: "אל תמזוג את הסויה ישירות על עור הדג המאודה – מזוג אותה ברווח שסביב הפילה."
        next_step_prep: "הגש מיד לשולחן כשהצלחת מעלה אדים."
        time_estimate: "30 שניות"

  # 11. ריזוטו ארבוריו
  - title: "ריזוטו מילאנזה קלאסי בזעפרן"
    archetype_ref: "grain_starch_releasing"
    ingredient_ref: "grain_rice_arborio"
    method_ref: "pan_sear"
    steps:
      - step_number: 1
        action: "המס 30 גרם חמאה בסיר רחב, טגן שאלוט קצוץ דק עד שקיפות, והוסף את האורז לקליה יבשה (Tostatura)."
        sensory_checkpoint: "גרגירי האורז נעשים שקופים בשוליהם עם נקודה לבנה במרכזם, וחמים מאוד למגע יד."
        early_warning: "אל תשטוף את האורז במים לעולם! שטיפה תחסל את העמילן החיוני למרקם הקרמי."
        next_step_prep: "הכן חצי כוס יין לבן יבש וציר עוף רותח מעורבב עם חוטי זעפרן."
        time_estimate: "3 דקות"
      - step_number: 2
        action: "מזוג את היין הלבן וערבב ברציפות עד שכל הנוזל מתאדה ונבלע לחלוטין באורז."
        sensory_checkpoint: "ריח החמיצות האלכוהולית נעלם כליל; תחתית הסיר יבשה ומשמיעה רחש קל."
        early_warning: "הוספת ציר לפני שהיין התאדה במלואו תשאיר חמיצות אלכוהולית בוסרית בריזוטו."
        next_step_prep: "החזק מצקת ציר רותח מוכנה."
        time_estimate: "2 דקות"
      - step_number: 3
        action: "הוסף ציר רותח בהדרגה (מצקת אחת בכל פעם), וערבב ברציפות בכף עץ במשך 16-17 דקות."
        sensory_checkpoint: "הנוזל בסיר הופך סמיך וקרמי מעצמו; הגרגירים שומרים על גרעין אל-דנטה פנימי נגיס."
        early_warning: "ציר קר ינחית את טמפרטורת הבישול ויגרום לעמילן להתגבש לגושים צמיגיים."
        next_step_prep: "חתוך 40 גרם חמאה קרה מאוד לקוביות וגרד כוס פרמז'ן רג'אנו."
        time_estimate: "17 דקות"
      - step_number: 4
        action: "הורד מהאש, הוסף את החמאה הקרה והפרמז'ן, ונער את הסיר במרץ ליצירת תחליב (Mantecatura)."
        sensory_checkpoint: "הריזוטו נע בגלים רכים כמשי (All'onda) ואינו עומד בצורה נוקשה כמו דייסה."
        early_warning: "לעולם אל תוסיף גבינה וחמאה על אש פעילה – השומן ייפרד ויהפוך לשלולית שמן צפה."
        next_step_prep: "צלח מיד בצלחות שטוחות ודפוק קלות על תחתית הצלחת לשטיחה מושלמת."
        time_estimate: "2 דקות"

  # 12. בטטה צלויה
  - title: "בטטה צלויה שלמה בקרמליזציה איטית"
    archetype_ref: "root_tuber_starchy"
    ingredient_ref: "veg_sweet_potato"
    method_ref: "oven_roast"
    steps:
      - step_number: 1
        action: "שטוף היטב את קליפת הבטטה, נגב במגבת, וחורר עם סכין ב-4 מקומות שונים."
        sensory_checkpoint: "הקליפה יבשה ונקייה; החריצים רדודים בעומק של כ-1 ס\"מ."
        early_warning: "אי-חירור של הבטטה עלול להוביל לפיצוץ אלים של הקליפה עקב לחץ אדים פנימי בתנור."
        next_step_prep: "חמם תנור ל-170°C ורפד תבנית בנייר אפייה."
        time_estimate: "2 דקות"
      - step_number: 2
        action: "הנח את הבטטה בתבנית וצלה במשך 70-80 דקות ללא כיסוי."
        sensory_checkpoint: "סירופ סוכר כהה ומקורמל מתחיל לזלוג מחריצי הקליפה ולהתקרש על נייר האפייה."
        early_warning: "חום גבוה מדי (מעל 190°C) ישרוף את הסוכרים החיצוניים לפני שהעמילנים בליבה יהפכו למלטוז מתוק."
        next_step_prep: "הכן מגבת מטבח נקייה לבדיקת מוכנות."
        time_estimate: "75 דקות"
      - step_number: 3
        action: "לחץ קלות עם המגבת על מרכז הבטטה: היא צריכה להרגיש רכה ונכנעת לחלוטין ללא התנגדות."
        sensory_checkpoint: "תחושה של כרית רכה; הקליפה התנתקה חלקית מהבשר הפנימי."
        early_warning: "אם המרכז עדיין נוקשה, החזר ל-15 דקות נוספות. בטטה חצי-אפויה היא גרגירית ומאכזבת."
        next_step_prep: "הכן מלח ים אטלנטי, פלפל שחור גרוס וקוביית חמאה קרה."
        time_estimate: "2 דקות"
      - step_number: 4
        action: "בצע חתך אורכי עמוק, פתח את הבטטה המהבילה עם האצבעות, ופזר פתיתי מלח וחמאה פנימה."
        sensory_checkpoint: "החמאה נמסה מיד לתוך הבשר הכתום המבריק והנימוח."
        early_warning: "אל תמעך למחית – תן למרקם הטבעי לעמוד בפני עצמו."
        next_step_prep: "הגש מיד בעודה לוהטת."
        time_estimate: "1 דקה"

  # 13. ברוקולי מוקפץ
  - title: "ברוקולי מוקפץ בשום, שמן זית וצ'ילי"
    archetype_ref: "cruciferous_firm"
    ingredient_ref: "veg_broccoli"
    method_ref: "stir_fry"
    steps:
      - step_number: 1
        action: "חתוך את הברוקולי לתפרחות בינוניות וחלוט בסיר מים מומלחים רותחים במשך 90 שניות."
        sensory_checkpoint: "צבע הברוקולי הופך לירוק-זרחני בוהק ומלא חיים."
        early_warning: "אל תבשל מעבר ל-90 שניות – חליטת יתר תהפוך את הברוקולי לסמרטוטי ותשחרר ריח גופרית."
        next_step_prep: "הכן קערה עם מי קרח צמוד לכיריים ומסננת."
        time_estimate: "3 דקות"
      - step_number: 2
        action: "העבר מיד למי הקרח לעצירת בישול מוחלטת, סנן ויבש היטב במגבת."
        sensory_checkpoint: "התפרחות קרות לחלוטין למגע ויבשות מטיפות מים."
        early_warning: "הכנסת ברוקולי רטוב למחבת עם שמן לוהט תגרום להתזות מסוכנות ולאידוי במקום צריבה."
        next_step_prep: "פרוס 3 שיני שום וטבעות צ'ילי טרי; חמם מחבת רחבה."
        time_estimate: "3 דקות"
      - step_number: 3
        action: "חמם 3 כפות שמן זית במחבת, הוסף את השום והצ'ילי ל-20 שניות עד להפצת ריח."
        sensory_checkpoint: "שום רוחש בשמן ומשחרר ארומה מתקתקה ללא שום שינוי צבע לחום."
        early_warning: "שום זהוב יהפוך תוך 5 שניות לשום חרוך ומר. הוסף את הברוקולי מיד!"
        next_step_prep: "החזק את הברוקולי ביד לקראת זריקה מהירה למחבת."
        time_estimate: "20 שניות"
      - step_number: 4
        action: "הוסף את הברוקולי על להבה חזקה ביותר והקפץ במרץ במשך 2 דקות עד להופעת סימני חריכה."
        sensory_checkpoint: "קצוות התפרחות נחרכים קלות; הירק שומר על נגיסות מתפצחת (קראנץ')."
        early_warning: "אל תכסה את המחבת במכסה – כליאת אדים תהרוס את הפריכות ותכהה את הצבע."
        next_step_prep: "סחוט חצי לימון טרי מעל וכבה את האש מיד."
        time_estimate: "2 דקות"

  # 14. פילה בקר סו-וויד
  - title: "פילה בקר סו-וויד עם צריבת מחבת הפוכה"
    archetype_ref: "beef_tender_fast"
    ingredient_ref: "beef_tenderloin"
    method_ref: "sous_vide"
    steps:
      - step_number: 1
        action: "תבל את נתח הפילה במלח גס, אטום בשקית ואקום ייעודית ושקע באמבט מים ב-52°C למשך שעה וחצי."
        sensory_checkpoint: "השקית שקועה במלואה מתחת למים ואינה צפה כלל."
        early_warning: "אם השקית צפה, יש כיס אוויר פנימי הפוגע במוליכות התרמית. אטום מחדש עם משקולת."
        next_step_prep: "הכן מחבת ברזל יצוקה, שמן בעל נקודת עישון גבוהה ונייר סופג."
        time_estimate: "90 דקות"
      - step_number: 2
        action: "הוצא את הנתח מהשקית והספג כל טיפת לחות משטח הפנים באמצעות 3 שכבות נייר סופג."
        sensory_checkpoint: "הבשר יבש לחלוטין ומט; מראה חיוור ואפרפר (מצב טבעי לפני צריבה)."
        early_warning: "אם הבשר יישאר לח, חום המחבת יוקדש לאידוי מים במקום לתגובת מייאר, והמרכז יתבשל יתר על המידה."
        next_step_prep: "חמם את מחבת הברזל לחום קיצוני עד להעלאת עשן סמיך."
        time_estimate: "3 דקות"
      - step_number: 3
        action: "מזוג כף שמן למחבת וצרוב את הנתח 45 שניות מכל צד, כולל גלגול שוליים מהיר."
        sensory_checkpoint: "צבע חום-שוקולד עמוק מתפתח מיד בשניות הראשונות."
        early_warning: "אל תחרוג מ-45 שניות לצד! הליבה כבר בטמפרטורה המושלמת, חריגה תייצר טבעת אפורה ויבשה."
        next_step_prep: "הוסף קוביית חמאה קטנה ב-10 השניות האחרונות לזיגוג מהיר."
        time_estimate: "1.5 דקות"
      - step_number: 4
        action: "העבר לקרש עץ, פרוס מיד לפרוסות עבות והגש (אין צורך במנוחה ממושכת)."
        sensory_checkpoint: "אדמומיות מושלמת, אחידה ומבריקה מקיר לקיר ללא שוליים אפורים כלל."
        early_warning: "אל תמתין למנוחה של 10 דקות – בשר סו-וויד לא סובל ממתח נוזלים ומוטב לאוכלו בעודו חם."
        next_step_prep: "פזר גבישי מלח מאלדון מעל פרוסות הבשר החשופות."
        time_estimate: "1 דקה"

  # 15. שווארמה הודו
  - title: "שווארמה הודו פריכה במחבת ברזל לוהטת"
    archetype_ref: "poultry_fatty_bone"
    ingredient_ref: "turkey_thigh"
    method_ref: "pan_sear"
    steps:
      - step_number: 1
        action: "פרוס את ירך ההודו לרצועות דקות בניצב לסיב, ותבל בתערובת שווארמה, שום כתוש ו-2 כפות שמן."
        sensory_checkpoint: "הרצועות מצופות בשכבת תבלינים שמנונית ואחידה; אין גושי בשר יבשים."
        early_warning: "אל תוסיף מים או מרינדה נוזלית מדי – המטרה היא צריבה לוהטת ולא בישול ברוטב."
        next_step_prep: "חמם מחבת ברזל יצוקה עד לסף חום מקסימלי."
        time_estimate: "15 דקות"
      - step_number: 2
        action: "פזר רבע מכמות הבשר בשכבה בודדת על פני המחבת הלוהטת ללא מגע למשך 90 שניות."
        sensory_checkpoint: "רעש צריבה אדיר; שולי הרצועות משחימים במהירות ומתקמרים קלות."
        early_warning: "העמסת יתר של המחבת תגרום לצניחת חום קיצונית, להפרשת נוזלים ולבשר מכובס."
        next_step_prep: "הכן מרית מתכת חדה להפיכה מהירה."
        time_estimate: "1.5 דקות"
      - step_number: 3
        action: "הפוך את הבשר לעוד 60 שניות עד שכל הקצוות פריכים ושחומים, והוצא מיד לקערה מכוסה."
        sensory_checkpoint: "קצוות פריכים ומושחמים בניחוח צלייה עז, מרכז עסיסי."
        early_warning: "אל תייבש את הבשר מעבר ל-60 שניות – הודו נקבה מתייבש מהר אם עוברים את הזמן."
        next_step_prep: "חמם את המחבת שוב למקסימום חום לפני הנגלה הבאה."
        time_estimate: "1 דקה"
      - step_number: 4
        action: "חזור על הפעולה עם יתרת הבשר, אחד את כל הנגלות בקערה וערבב עם הנוזלים שהצטברו."
        sensory_checkpoint: "בשר לוהט, מבריק, עשיר בשומן צרוב ונוזלים מרוכזים."
        early_warning: "אל תסנן את הנוזלים מהקערה – הם מכילים את כל תמצית הטעם של התבלינים והצריבה."
        next_step_prep: "הגש מיד בתוך פיתה חמה עם טחינה ועמבה."
        time_estimate: "3 דקות"

  # 16. המבורגר קלאסי
  - title: "המבורגר בקר קלאסי צרוב על פלנצ'ה"
    archetype_ref: "beef_ground_emulsion"
    ingredient_ref: "beef_ground"
    method_ref: "pan_sear"
    steps:
      - step_number: 1
        action: "עצב קציצה במשקל 200 גרם בידיים קרות בדחיסה עדינה, וצור שקע קל בעומק 1 ס\"מ במרכז."
        sensory_checkpoint: "קציצה אוורירית השומרת על צורתה; השקע מונע מההמבורגר לתפוח לכדור."
        early_warning: "דחיסה חזקה מדי תהפוך את הבשר לדחוס וצמיגי במרקם נקניקייה. התייחס לבשר בעדינות."
        next_step_prep: "חמם מחבת יצוקה יבשה לחלוטין לחום גבוה ביותר; הכן מלח שולחן דק."
        time_estimate: "2 דקות"
      - step_number: 2
        action: "הנח את הקציצה במחבת הלוהטת והמלח בנדיבות במלח דק ובפלפל ישירות על הבשר החשוף."
        sensory_checkpoint: "רחישה מיידית עזה; שומן מתחיל להינמס ולהזין את קרקעית המחבת."
        early_warning: "לעולם אל תמלח בשר טחון לפני יצירת הקציצה – המלח שובר חלבונים וגורם לקשיחות."
        next_step_prep: "הכן מרית מתכת שטוחה וחזקה (ללא חורים)."
        time_estimate: "3 דקות"
      - step_number: 3
        action: "הפוך את ההמבורגר פעם אחת בלבד לאחר שנוצר קרום חום עמוק (כ-3.5 דקות מצד ראשון)."
        sensory_checkpoint: "קרום חום-שוקולד אחיד ומפצפץ (Crust) המכסה את כל שטח הפנים."
        early_warning: "בשום אופן אל תלחץ עם המרית על הקציצה! לחיצה תסחט את כל השומן והמיצים לאש."
        next_step_prep: "הנח פרוסת גבינה (צ'דר או גאודה) מעל הקציצה והכן מכסה עגול."
        time_estimate: "2 דקות"
      - step_number: 4
        action: "הוסף כפית מים לדופן המחבת, כסה מיד במכסה ל-45 שניות להמסת הגבינה באדים, וחלץ ללחמנייה."
        sensory_checkpoint: "הגבינה מומסת לחלוטין ועוטפת את הקציצה כשמיכה חלקה ומבריקה."
        early_warning: "אל תשאיר את המכסה מעבר לדקה כדי לא להפוך את הקרום הפריך ללח מדי."
        next_step_prep: "הנח למבורגר לנוח 3 דקות בתוך הלחמנייה הקלויה לפני הביס הראשון."
        time_estimate: "1.5 דקות"

  # 17. שרימפס מוקפץ
  - title: "שרימפס מוקפץ בחמאת שום, יין לבן ופטרוזיליה"
    archetype_ref: "seafood_crustacean_fast"
    ingredient_ref: "seafood_shrimp"
    method_ref: "pan_sear"
    steps:
      - step_number: 1
        action: "ייבש היטב את השרימפס בנייר סופג, וחמם כף שמן זית במחבת רחבה על אש גבוהה."
        sensory_checkpoint: "השמן חם מאוד ונע במהירות; השרימפס יבשים לחלוטין למגע."
        early_warning: "שרימפס לחים יתבשלו באדים ולא ייצרבו. ייבוש קפדני הוא תנאי בל יעבור."
        next_step_prep: "קצוץ 3 שיני שום ופטרוזיליה; חתוך 30 גרם חמאה קרה לקוביות."
        time_estimate: "2 דקות"
      - step_number: 2
        action: "הנח את השרימפס בשכבה בודדת מרווחת וצרוב במשך 60 שניות ללא תזוזה."
        sensory_checkpoint: "צבע החלק התחתון הופך מוורוד שקוף לאטום וכתום בוהק."
        early_warning: "אל תערבב עד שנוצר פס צבע ברור לאורך שולי הבשר."
        next_step_prep: "הכן את השום והחמאה לזריקה מיידית."
        time_estimate: "1 דקה"
      - step_number: 3
        action: "הפוך את השרימפס, הוסף מיד את השום והחמאה הקרה, ונער את המחבת ברציפות 45 שניות."
        sensory_checkpoint: "החמאה נמסה ומקציפה יחד עם השום; ארומה מתקתקה של פירות ים ושום."
        early_warning: "שמור על השום משריפה – החמאה הקרה מורידה מעט את החום ומגנה עליו."
        next_step_prep: "מדוד 2 כפות יין לבן יבש."
        time_estimate: "45 שניות"
      - step_number: 4
        action: "מזוג את היין, הוסף פטרוזיליה קצוצה, נער לקבלת אמולסיה סמיכה וכבה את האש מיד."
        sensory_checkpoint: "השרימפס מכופפים בצורת האות C מושלמת; הרוטב מבריק ואחיד."
        early_warning: "אם השרימפס נסגרו לטבעת הדוקה בצורת האות O, הם עברו בישול יתר ונעשו צמיגיים. חלץ מיד!"
        next_step_prep: "מזוג מיד לצלחת עמוקה עם לחם קלוי לטבילה."
        time_estimate: "30 שניות"

  # 18. אספרגוס חלוט וצרוב
  - title: "אספרגוס ירוק חלוט וצרוב בחמאה חומה"
    archetype_ref: "cruciferous_firm"
    ingredient_ref: "veg_asparagus_green"
    method_ref: "pan_sear"
    steps:
      - step_number: 1
        action: "אחוז בשני קצוות האספרגוס וכופף עד לשבירה טבעית; זרוק את הבסיס המעוצה וחלוט במים רותחים 90 שניות."
        sensory_checkpoint: "הגבעול נשבר בדיוק בנקודת החיבור הסיבית; צבע הגבעול נעשה ירוק-אזמרגד עז."
        early_warning: "חליטה ארוכה מ-90 שניות תרכך את הגבעולים ותגרום לראשים העדינים להתפרק."
        next_step_prep: "הכן קערת מי קרח להעברה מיידית."
        time_estimate: "3 דקות"
      - step_number: 2
        action: "העבר למי קרח לקירור מוחלט, סנן ונגב ביסודיות במגבת מטבח."
        sensory_checkpoint: "הגבעולים יציבים, פריכים וקרים לחלוטין."
        early_warning: "מים על גבי האספרגוס ימנעו את התחברות החמאה ויגרמו להשפרצות שומן."
        next_step_prep: "הנח מחבת רחבה על אש בינונית והוסף 30 גרם חמאה."
        time_estimate: "2 דקות"
      - step_number: 3
        action: "בשל את החמאה עד שהקצף שוכך, ומוצקי החלב מקבלים צבע אגוזי וניחוח קרמלי (Beurre Noisette)."
        sensory_checkpoint: "החמאה מקבלת גוון ענברי זהוב עם נקודות חומות עדינות וריח אגוזי לוז מובהק."
        early_warning: "יש שניות ספורות בין חמאה אגוזית לחמאה שרופה ושחורה. ברגע שהיא מזהיבה – זרוק את הירק."
        next_step_prep: "החזק את האספרגוס ביד להכנסה מיידית."
        time_estimate: "2 דקות"
      - step_number: 4
        action: "גלגל את האספרגוס בחמאה החומה למשך 60 שניות לחימום וברק, פזר מלח מאלדון והגש."
        sensory_checkpoint: "ציפוי חמאה מבריק העוטף את הגבעולים; קראנץ' מושלם בנגיסה."
        early_warning: "אל תשאיר את האספרגוס במחבת מעבר לדקה כדי לשמר את הפריכות הטבעית."
        next_step_prep: "העבר מיד לצלחת הגשה מאורכת."
        time_estimate: "1 דקה"

  # 19. צ'יפס דו-שלבי
  - title: "צ'יפס תפוחי אדמה בטיגון דו-שלבי מושלם"
    archetype_ref: "root_tuber_starchy"
    ingredient_ref: "veg_potato_russet"
    method_ref: "deep_fry"
    steps:
      - step_number: 1
        action: "חתוך למקלות בעובי 1 ס\"מ, שטוף במים קרים זורמים עד שהמים צלולים לחלוטין, וייבש במגבת."
        sensory_checkpoint: "המים יוצאים שקופים ללא עכירות עמילנית; מקלות תפוחי האדמה יבשים."
        early_warning: "עמילן חופשי שלא נשטף יישרף בשמן ויגרום לצ'יפס להידבק ולהשחים בטרם עת."
        next_step_prep: "חמם סיר טיגון עמוק עם שמן ל-145°C מדודות במדחום."
        time_estimate: "10 דקות"
      - step_number: 2
        action: "טגן טיגון ראשוני (Blanching) בחום נמוך (145°C) במשך 6-7 דקות עד להתרככות ללא השחמה."
        sensory_checkpoint: "הצ'יפס חיוור לחלוטין אך רך ונמעך בקלות בלחיצת אצבע קלה."
        early_warning: "אם הצ'יפס מתחיל להזהיב בשלב זה, השמן חם מדי – הנמך חום מיד."
        next_step_prep: "פרוס את הצ'יפס על רשת קירור מוגבהת לצינון של 30 דקות לפחות."
        time_estimate: "8 דקות"
      - step_number: 3
        action: "העלה את חום השמן ל-190°C וטגן את הצ'יפס המצונן במנות קטנות במשך 2-3 דקות עד להזהבה עמוקה."
        sensory_checkpoint: "צבע זהוב בוהק; צליל מתכתי וקשיח כשמנערים את הצ'יפס ברשת הסינון."
