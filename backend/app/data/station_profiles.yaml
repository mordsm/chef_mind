profiles:
  - id: nile_perch
    title: נסיכת הנילוס
    aliases: [נסיכת הנילוס, nile perch, lates niloticus]
    family: fish
    ingredient_family: freshwater-fish
    preferred_method: boil_simmer
    preparation: "הכן קרש נפרד לדגים, סכין, נייר סופג ומדחום מחט. הוצא את נסיכת הנילוס מהמקרר סמוך לבישול וייבש היטב בנייר. בהכנה הזו אין צורך בהשריה בחלב, לימון או מי מלח. ייבש את הדג והמשך לבישול."
    science: "בחום חזק בשר הדג מתכווץ ומאבד נוזלים, ורקמת החיבור שמחזיקה אותו מתרככת. לכן בישול עדין ברוטב עוזר לשמור על נתח עסיסי שלא מתפרק. קולגן הוא חלק מרקמת החיבור הזו. לעיתים יש בדגי מים מתוקים חומרים בעלי ריח אדמתי, גיאוזמין (geosmin) ו־2-MIB. אין לנו בדיקה שמראה שהם נמצאים בדג שלך, ולכן איננו מציעים השריה כפתרון מוכח."
    flavor: "לפני הכנסת הדג, טעם את הרוטב בכפית נקייה. חסר מלח? הוסף קמצוץ קטן, ערבב וטעם שוב. רוצה טעם לימוני? נסה כמה טיפות לימון בכף רוטב נפרדת. אהבת? הוסף מעט לימון לסיר וטעם שוב.\nרוצה משהו פריך מעל הדג? אם לחם מתאים לך, ערבב מעט פירורי לחם במחבת יבשה עד שהם מזהיבים. פזר על הדג בצלחת, ממש לפני האכילה. התוספת הזו אינה חובה.\nלשתייה לצד המנה: אפשר מים או מים מוגזים עם פלח לימון בכוס. אין הכוונה לשפוך אותם לרוטב. למי שרוצה יין: Chenin Blanc יבש מ־Anjou שבעמק הלואר, צרפת. בחר מה שטעים לך."
    wikilinks: ["[[Nile Perch]]", "[[Geosmin Hydrolysis]]", "[[Fish Collagen]]", "[[Low-Temperature Poaching]]"]
    tags: ["culinary/ingredient/freshwater-fish", "culinary/science/geosmin", "culinary/technique/poaching"]
    gaps: ["זמן חימום לפי נתח ועובי לא אומת", "טיפול מקדים בחומצה, מלח או חלב: ריכוז ומשך לא אומתו", "אין אימות לפירוק 2-MIB בטיפול הביתי המוצע", "התאמת היין היא הצעה קולינרית"]
    sources:
