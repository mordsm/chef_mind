fish_safety:
  approval_status: APPROVED
  core_c: 63
  hold_seconds: 15
  approval_date: "2026-11-05"
  approval_basis: "Owner approval in conversation for intact, unstuffed finfish; kitchen-specific HACCP validation remains separate."
  source: https://www.fda.gov/media/164194/download
  section: FDA Food Code 2022, 3-401.11(A)(1), 3-501.14
  scope: unstuffed intact finfish; not minced fish, stuffed fish or raw service
  cooling: "אם שומרים להמשך במקום להגיש: חלק מיד לכלים קטנים ורדודים והתחל קירור מהיר; אל תחכה שהסיר יתקרר על השיש. אפשר להיעזר באמבט מי קרח מסביב לכלי. בדוק במדחום: מ־57°C ל־21°C בתוך שעתיים, ואז עד 5°C בתוך 6 שעות בסך הכול מתחילת הירידה מ־57°C. המשך לאחסון במקרר מתחת ל־4°C. הזמנים הם גבולות לקירור, לא זמן המתנה לפני שמכניסים למקרר."
  rest: "5. הוצא להגשה אחרי שהמרכז הגיע ליעד והשלמת את זמן ההחזקה. אל תוציא את הדג מוקדם מתוך הנחה שימשיך להתחמם בצלחת. אין צורך להמתין עוד אחרי שהושלם הבישול."
fish_time_guide:
  source: https://www.fishfiles.com.au/consuming/cooking/poaching
  source_id: SRC-FRDC-FISH-POACHING
  text: "כמה זמן לתכנן? מדריך Fishfiles נותן לפילה בעובי 1 ס״מ כ־3 דקות, 2 ס״מ כ־5 דקות, ו־3 ס״מ כ־5–8 דקות, בנוזל בחום 75–85°C. אלו זמני הערכה כלליים, לא מתכון בדוק לנסיכת הנילוס. ברוטב שלנו, ב־70–80°C, ייתכן שיידרש יותר זמן, במיוחד בקצה הקר של הטווח. ספור מהרגע שהרוטב חזר לחום הרצוי אחרי הכנסת הדג. בדוק במהלך הבישול, ואל תפסיק רק כי נגמרו הדקות: המדידה במרכז הדג קובעת מתי לסיים."
