universal_methods:
  - pan_sear
  - grill_direct
  - oven_roast_dry
  - braise_slow_cook
  - boil_simmer
  - steam
  - stir_fry
  - deep_fry
  - sous_vide
  - raw_cure

failure_reasons:
  FISH_GENTLE_PROCESS:
    code: "ERR_FISH_PROCESS_UNVALIDATED"
    message: "פרופיל דגי המים המתוקים מתעדף חימום עדין ומדיד ברוטב. אין כאן תהליך מאומת לטיגון ממושך או לחימום אגרסיבי העלול לייבש ולהעביר את הליבה מעבר ליעד; אין זו טענה שכל טיגון או צלייה בלתי אפשריים."
  COLLAGEN_DRY_HEAT:
    code: "ERR_COLLAGEN_DRY"
    message: "עשיר בקולגן ודל שומן. חום יבש מאדה נוזלים לפני פירוק רקמת החיבור; מתקבל מרקם גומי קשה."
  LEAN_PROTEIN_DRY:
    code: "ERR_LEAN_OVERCOOK"
    message: "חלבון רזה נטול קולגן. בישול ממושך או רטוב סוחט את הלחות התאית ומותיר סיבים יבשים."
  DELICATE_STRUCTURE_COLLAPSE:
    code: "ERR_STRUCTURE_COLLAPSE"
    message: "מבנה חלבוני עדין ודל קולגן. תנועה אגרסיבית או חום רטוב מפרקים את הנתח לרסק."
  HIGH_MOISTURE_COLLAPSE:
    code: "ERR_HIGH_MOISTURE"
    message: "תכולת מים גבוהה (מעל 90%). חום יבש או טיגון גורם לקריסת דפנות התא והצפת נוזלים."
  STARCH_UNDERCOOKED:
    code: "ERR_STARCH_RAW"
    message: "מבנה עמילני דחוס הדורש ג'לטיניזציה ממושכת בחום; צריבה מהירה מותירה מרכז נוקשה."
  TOXIN_OR_BITTER_RAW:
    code: "ERR_TOXIN_RAW"
    message: "מכיל רכיבים מרירים או מעכבי עיכול הדורשים פירוק בחום."
  MICROBIAL_HAZARD:
    code: "ERR_BIOHAZARD"
    message: "סיכון ביולוגי/פתוגני (חיידקי מעיים ועופות). חובה לבשל בישול תרמי מלא."

archetypes:
  freshwater_white_fish:
    name: "דגי מים מתוקים — חימום עדין ומבוקר ברוטב"
    allowed_methods:
      - boil_simmer
      - steam
    blocked_methods:
      deep_fry: "FISH_GENTLE_PROCESS"
      grill_direct: "FISH_GENTLE_PROCESS"
      pan_sear: "FISH_GENTLE_PROCESS"
      oven_roast_dry: "FISH_GENTLE_PROCESS"
      braise_slow_cook: "FISH_GENTLE_PROCESS"
      stir_fry: "FISH_GENTLE_PROCESS"
      raw_cure: "MICROBIAL_HAZARD"
      sous_vide: "MICROBIAL_HAZARD"
  dense_collagen_lean:
    name: "שרירים עתירי קולגן ודלי שומן"
    allowed_methods:
      - braise_slow_cook
      - boil_simmer
      - sous_vide
    blocked_methods:
      oven_roast_dry: "COLLAGEN_DRY_HEAT"
      pan_sear: "COLLAGEN_DRY_HEAT"
      grill_direct: "COLLAGEN_DRY_HEAT"
      stir_fry: "COLLAGEN_DRY_HEAT"
      deep_fry: "COLLAGEN_DRY_HEAT"
      steam: "COLLAGEN_DRY_HEAT"
      raw_cure: "MICROBIAL_HAZARD"

  lean_tender_muscle:
    name: "חלבונים רזים לבישול מהיר"
    allowed_methods:
      - pan_sear
      - grill_direct
      - stir_fry
      - sous_vide
      - steam
    blocked_methods:
      braise_slow_cook: "LEAN_PROTEIN_DRY"
      boil_simmer: "LEAN_PROTEIN_DRY"
      oven_roast_dry: "LEAN_PROTEIN_DRY"

  delicate_white_fish:
    name: "דגים לבנים עדינים"
    allowed_methods:
      - pan_sear
      - steam
      - oven_roast_dry
      - sous_vide
    blocked_methods:
      braise_slow_cook: "DELICATE_STRUCTURE_COLLAPSE"
      boil_simmer: "DELICATE_STRUCTURE_COLLAPSE"
      stir_fry: "DELICATE_STRUCTURE_COLLAPSE"

  watery_tender_greens:
    name: "עלים וירקות מימיים"
    allowed_methods:
      - raw_cure
    blocked_methods:
      braise_slow_cook: "HIGH_MOISTURE_COLLAPSE"
      boil_simmer: "HIGH_MOISTURE_COLLAPSE"
      oven_roast_dry: "HIGH_MOISTURE_COLLAPSE"
      deep_fry: "HIGH_MOISTURE_COLLAPSE"
      steam: "HIGH_MOISTURE_COLLAPSE"

  dense_starchy_tubers:
    name: "פקעות ושורשים עתירי עמילן"
    allowed_methods:
      - oven_roast_dry
      - boil_simmer
      - braise_slow_cook
      - steam
      - deep_fry
    blocked_methods:
      raw_cure: "TOXIN_OR_BITTER_RAW"
      pan_sear: "STARCH_UNDERCOOKED"
      stir_fry: "STARCH_UNDERCOOKED"

